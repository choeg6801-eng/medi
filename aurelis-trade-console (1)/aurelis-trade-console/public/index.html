const DOCS_COMMON=[['ISO 13485 인증서','품질경영시스템 인증 · 3년 유효, 매년 사후심사'],['자유판매증명서 (CFS)','식약처 발급 · 대부분 국가에서 발급 1년 이내본 요구'],['적합성 선언서 (DoC)','제조사 서명 · 적용 규격 목록 포함'],['기술문서 (Technical File / STED)','설계·위험관리(ISO 14971)·임상평가 요약'],['시험성적서','전기안전 IEC 60601-1, 생체적합성 ISO 10993 등'],['사용설명서 (IFU) 현지어본','수입국 공용어 번역 · 공증 요구 여부 확인'],['라벨 시안 (UDI 포함)','GS1 바코드 + HRI, 현지 수입자 정보 표기']];
/* 11. UDI */
function parseUDI(s){s=s.trim();const out=[];const re=/\((\d{2,4})\)([^(]*)/g;let m;while((m=re.exec(s)))out.push([m[1],m[2].trim()]);return out}
const AI={'01':'GTIN (기기 식별자, DI)','17':'유효기한 (YYMMDD)','11':'제조일자 (YYMMDD)','10':'로트 번호','21':'일련번호'};
def('udi','추적 · 품질','UDI 이력 추적','UDI 바코드 문자열이나 로트 번호를 입력하면 GS1 항목을 해석하고, 제조부터 병원까지 유통 경로를 역추적합니다.',root=>{
  const sample=`(01)${gtin14(P('DX').gtin)}(17)${fd(addDays(TODAY,293)).slice(2).replace(/-/g,'')}(10)DX2607A`;
  root.innerHTML=head('추적 · 품질','UDI 이력 추적',CUR.desc)+`
  <section class="card stack"><div class="form" style="grid-template-columns:minmax(0,1fr) auto;align-items:end"><div class="field"><label for="uin">UDI (GS1 괄호 형식) 또는 로트 번호</label><input id="uin" class="mono" value="${sample}"></div><button class="btn pri" id="ugo">추적</button></div>
  <div class="hstack note">예시: ${LOTS.map(l=>`<button class="chip" data-l="${l.lot}">${l.lot}</button>`).join('')}<button class="chip" data-l="(01)${gtin14(P('US200').gtin)}(11)${fd(addDays(TODAY,-95)).slice(2).replace(/-/g,'')}(10)US2606K(21)SN000417">초음파 UDI</button></div></section>
  <div class="row"><section class="card c-6" id="upar"></section><section class="card c-6" id="utr"></section></div>`;
  function go(){
    const v=$('#uin').value.trim(),ais=parseUDI(v);let lot=null,rows='';
    if(ais.length){rows=ais.map(([k,val])=>{let note='',ok=true;if(k==='01'){ok=gtinValid(val);const p=PRODUCTS.find(p=>gtin14(p.gtin)===val);note=ok?(p?p.name:'등록되지 않은 GTIN'):'체크 디지트 오류'}
      if(k==='17'||k==='11'){const d=new Date(2000+ +val.slice(0,2),+val.slice(2,4)-1,+val.slice(4,6));note=fd(d)+(k==='17'?` · ${ddl(dleft(d))}`:'')}
      if(k==='10')lot=val;return `<tr><td class="mono">(${k})</td><td>${AI[k]||'기타 AI'}</td><td><div class="mono" style="word-break:break-all">${esc(val)}</div>${note?`<div class="note"${ok?'':' style="color:var(--crit)"'}>${note}</div>`:''}</td></tr>`}).join('')}
    else lot=v.toUpperCase();
    const L=LOTS.find(l=>l.lot===lot);
    $('#upar').innerHTML=`<div class="card-h"><h2 class="ct">GS1 UDI 해석</h2>${ais.length?pill('ok',ais.length+'개 항목'):pill('plain','로트 번호 직접 입력')}</div>`+(ais.length?`<div class="tbl"><table class="data"><thead><tr><th>AI</th><th>항목</th><th>값 · 확인</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="note">UDI 형식이 아니어서 로트 번호로 조회했습니다. 예: (01)GTIN(17)유효기한(10)로트</p>');
    if(!L){$('#utr').innerHTML=`<div class="callout warn"><b>로트를 찾지 못했습니다</b>"${esc(lot||'')}"와 일치하는 로트가 없습니다. 예시 로트(${LOTS.map(l=>l.lot).join(', ')}) 중 하나를 입력해 보세요.</div>`;return}
    const p=P(L.p),tot=L.nodes.reduce((a,n)=>a+n.qty,0);
    const node=n=>`<li><span class="node"><b>${n.n}</b><span class="ty">${n.ty}</span>${n.c&&n.c!=='—'?`<span class="code">${n.c}</span>`:''}<span class="num note">${nf(n.qty)}${n.used?` · 사용 ${nf(n.used)}`:''}</span></span>${n.kids?`<ul>${n.kids.map(node).join('')}</ul>`:''}</li>`;
    $('#utr').innerHTML=`<div class="card-h"><div><div class="eyebrow">${p.short} · ${L.sn?'일련번호 관리':'로트 관리'}</div><h2 class="ct" style="font-size:18px">${L.lot}</h2></div><a class="btn" href="#recall" data-lot="${L.lot}">리콜 시뮬레이션 →</a></div>
    <dl class="kv" style="margin-bottom:14px"><dt>제조일</dt><dd class="mono">${fd(addDays(TODAY,L.mfg))}</dd><dt>유효기한</dt><dd class="mono">${fd(addDays(TODAY,L.exp))} (${ddl(L.exp)})</dd><dt>생산 수량</dt><dd>${nf(L.qty)}</dd><dt>추적된 수량</dt><dd>${nf(tot)} (${Math.round(tot/L.qty*100)}%)</dd></dl>
    <h2 class="ct" style="margin-bottom:8px">유통 경로</h2><ul class="tree"><li><span class="node"><b>제조 · 오송 공장</b><span class="ty">제조</span><span class="num note">${nf(L.qty)}</span></span><ul>${L.nodes.map(node).join('')}</ul></li></ul>`;
  }
  $('#ugo').onclick=go;$('#uin').onkeydown=e=>{if(e.key==='Enter')go()};
  root.addEventListener('click',e=>{const c=e.target.closest('[data-l]');if(c){$('#uin').value=c.dataset.l;go()}const r=e.target.closest('[data-lot]');if(r)window.__lot=r.dataset.lot});
  go();
});

/* 12. recall */
def('recall','추적 · 품질','리콜 시뮬레이터','특정 로트에 결함이 생겼다고 가정하고, 전 세계에 남은 재고와 회수 범위, 예상 비용을 계산합니다.',root=>{
  let lot=window.__lot||'DX2607A';window.__lot=null;
  root.innerHTML=head('추적 · 품질','리콜 시뮬레이터',CUR.desc)+`
  <section class="card"><div class="form"><div class="field"><label for="rl">대상 로트</label><select id="rl">${LOTS.map(l=>`<option ${l.lot===lot?'selected':''}>${l.lot}</option>`).join('')}</select></div>
  <div class="field"><label for="rlv">조치 방식</label><select id="rlv"><option value="1">전량 회수 · 사용분 포함 추적</option><option value="2" selected>미사용 재고 회수</option><option value="3">현장 시정 · 라벨 교체 등</option></select></div>
  <div class="field"><label for="rc1">회수 물류비 (USD/개)</label><input id="rc1" type="number" value="4.5" step=".1"></div>
  <div class="field"><label for="rc2">폐기비 (USD/개)</label><input id="rc2" type="number" value="1.2" step=".1"></div>
  <div class="field"><label for="rc3">대체품 공급 (제조원가 %)</label><input id="rc3" type="number" value="100"></div></div></section>
  <div class="kpis" id="rk"></div>
  <div class="row"><section class="card c-7"><div class="card-h"><h2 class="ct">위치별 잔여 재고</h2></div><div class="tbl"><table class="data"><thead><tr><th>위치</th><th>유형</th><th class="r">입고</th><th class="r">사용</th><th class="r">회수 대상</th><th>조치</th></tr></thead><tbody id="rt"></tbody></table></div></section>
  <section class="card c-5 stack"><h2 class="ct">회수 비용 구성</h2><div id="rd"></div><div id="rnote"></div></section></div>`;
  function calc(){
    const L=LOTS.find(l=>l.lot===$('#rl').value),p=P(L.p),lv=+$('#rlv').value,c1=+$('#rc1').value,c2=+$('#rc2').value,c3=+$('#rc3').value/100;
    const rows=[];L.nodes.forEach(n=>{if(n.kids){const sub=n.kids.reduce((a,k)=>a+k.qty,0);rows.push({n:n.n,ty:n.ty,c:n.c,qty:n.qty-sub,used:0});n.kids.forEach(k=>rows.push({n:k.n,ty:k.ty,c:n.c,qty:k.qty,used:k.used}))}else rows.push({n:n.n,ty:n.ty,c:n.c,qty:n.qty,used:n.used})});
    rows.forEach(r=>r.target=lv===1?r.qty:r.qty-r.used);
    const tq=rows.reduce((a,r)=>a+r.target,0),used=rows.reduce((a,r)=>a+r.used,0),countries=new Set(rows.filter(r=>r.target>0&&r.c!=='—').map(r=>r.c)).size;
    const usdNow=FX.USD.s[FX.USD.s.length-1],unitUSD=p.cost/usdNow;const log=tq*c1,disp=lv===3?0:tq*c2,rep=lv===3?tq*1.5:tq*unitUSD*c3,admin=4000+countries*2500,total=log+disp+rep+admin;
    $('#rk').innerHTML=`<div class="kpi"><span class="l">회수 대상 수량</span><span class="v">${nf(tq)}</span><span class="d">생산 ${nf(L.qty)} 중 ${Math.round(tq/L.qty*100)}%</span></div><div class="kpi"><span class="l">이미 사용됨</span><span class="v">${nf(used)}</span><span class="d">${lv===1?'환자 추적 관찰 필요':'회수 대상 제외'}</span></div><div class="kpi"><span class="l">영향 국가</span><span class="v">${countries}개국</span><span class="d">각국 당국 보고 필요</span></div><div class="kpi"><span class="l">예상 총비용</span><span class="v">${usd(total)}</span><span class="d">${won(total*usdNow)}</span></div>`;
    $('#rt').innerHTML=rows.map(r=>`<tr><td>${r.n} ${r.c&&r.c!=='—'?`<span class="code">${r.c}</span>`:''}</td><td>${r.ty}</td><td class="r">${nf(r.qty)}</td><td class="r">${nf(r.used)}</td><td class="r"><b>${nf(r.target)}</b></td><td>${r.target===0?pill('plain','해당 없음'):r.ty==='운송'?pill('crit','출하 중지'):r.ty==='본사 창고'?pill('warn','격리'):pill('info',lv===3?'현장 시정':'회수 통보')}</td></tr>`).join('');

const SELLER={EXW:[0],FCA:[0,1,2],FOB:[0,1,2],CPT:[0,1,2,3],CFR:[0,1,2,3],CIP:[0,1,2,3,4],CIF:[0,1,2,3,4],DAP:[0,1,2,3,4,7],DDP:[0,1,2,3,4,5,6,7,8]};
def('landed','가격 · 관세','Landed Cost 계산기','공장 출고가(EXW)부터 수입국 병원 도착까지 드는 모든 비용을 합산하고, 인코텀즈별로 누가 부담하는지 나눕니다.',root=>{
  root.innerHTML=head('가격 · 관세','Landed Cost 계산기',CUR.desc)+`
  <div class="row"><section class="card c-5 stack"><h2 class="ct">입력</h2><div class="form">
   <div class="field"><label for="lq">수량</label><input id="lq" type="number" value="40"></div>

   <div class="field"><label for="li">인코텀즈</label><select id="li">${INCO.map(i=>`<option ${i==='CIP'?'selected':''}>${i}</option>`).join('')}</select></div>
   <div class="field"><label for="c0">수출 포장 (USD)</label><input id="c0" type="number" value="600"></div>

   <div class="field"><label for="c5">수입 관세율 (%)</label><input id="c5" type="number" value="0" step=".1"></div>

  function calc(){
    const q=+$('#lq').value||0,up=+$('#lp').value||0,inc=$('#li').value,g=k=>+$('#c'+k).value||0;
    const goods=q*up,pre=goods+g(0)+g(1)+g(2)+g(3),ins=pre*1.1*g(4)/100,cif=pre+ins,duty=cif*g(5)/100,vat=(cif+duty)*g(6)/100;
    const items=[['수출 포장',g(0)],['국내 내륙운송',g(1)],['수출 통관·서류',g(2)],['국제 운임',g(3)],['적하보험',ins],['수입 관세',duty],['수입 부가세',vat],['현지 내륙 배송',g(7)],['수입 통관 수수료',g(8)]];
    const total=goods+items.reduce((a,b)=>a+b[1],0),sel=SELLER[inc];

    <div class="hstack" style="gap:20px;flex-wrap:wrap;align-items:flex-start">${donut([{label:'물품가',value:goods,c:'--line'},...items.map((x,i)=>({label:x[0],value:x[1],c:cols[i]}))].filter(x=>x.value>0),170,`<text x="85" y="80" text-anchor="middle" style="fill:var(--muted);font-size:11px">부대비용</text><text x="85" y="100" text-anchor="middle" style="fill:var(--ink);font-size:16px;font-weight:600">${usd(total-goods)}</text>`)}
    <div class="tbl" style="flex:1;min-width:260px"><table class="data"><thead><tr><th>비용 항목</th><th class="r">금액</th><th>${inc} 부담</th></tr></thead><tbody>
    <tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--line);margin-right:6px"></i>물품가 (EXW)</td><td class="r">${usd(goods)}</td><td>${pill('plain','—')}</td></tr>
    ${items.map((x,i)=>`<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(${cols[i]});margin-right:6px"></i>${x[0]}</td><td class="r">${usd(x[1])}</td><td>${sel.includes(i)?pill('info','수출자'):pill('plain','수입자')}</td></tr>`).join('')}
    <tr><td><b>수출자 / 수입자 부담 합계</b></td><td class="r" colspan="2"><b>${usd(sellerCost)}</b> / <b>${usd(buyerCost)}</b></td></tr></tbody></table></div></div>`;
  }
  $$('#lr ~ *, .card input, .card select',root).forEach(e=>e.oninput=calc);calc();
});

function rateOf(c,hs){const f=ftaOf(c);if(!f)return[0,null];const h4=String(hs||'').slice(0,4);const m=f.mfn[h4]??f.mfn.d;const p=f.pref?(f.pref[h4]??f.pref.d):null;return[m,p==null?null:Math.min(p,m)]}
def('fta','가격 · 관세','FTA 관세 시뮬레이터','수출국과 품목을 고르면 일반 관세(MFN)와 FTA 특혜세율을 비교하고, 부가가치 기준(RVC)으로 원산지 충족 여부를 확인합니다.',root=>{

   <div class="field"><label for="fv">과세가격 (CIF, USD)</label><input id="fv" type="number" value="480000"></div></div>
   <div class="divider"></div><h2 class="ct">원산지 판정 (RVC)</h2><div class="form">
   <div class="field"><label for="ffob">제품 FOB 가격 (USD/개)</label><input id="ffob" type="number" value="4800"></div>
   <div class="field"><label for="fvnm">비원산지 재료비 (USD/개)</label><input id="fvnm" type="number" value="2350"></div>
   <div class="field"><label for="fom">역내산 재료비 (USD/개)</label><input id="fom" type="number" value="1400"></div></div></section>
  <section class="card c-7 stack" id="fr"></section></div>
  <section class="card"><div class="card-h"><div><h2 class="ct">국가별 세율 비교</h2><div class="sub" id="fcmpT"></div></div><div class="chips" id="fcont">${['전체',...CONT_ORDER].map(c=>`<button class="chip" aria-pressed="${c===cont}">${c}</button>`).join('')}</div></div><div id="fcmp"></div></section>`;

    const bd=(fob-vnm)/fob*100,bu=om/fob*100,nom=vnm/fob*100;
    let rvcTxt='',pass=null;
    if(f.m==='bd'){pass=bd>=f.thr;rvcTxt=`공제법 RVC = (FOB − 비원산지 재료비) ÷ FOB = <b>${bd.toFixed(1)}%</b> (기준 ${f.thr}% 이상)`}
    else if(f.m==='bu'){pass=bu>=f.thr;rvcTxt=`집적법 RVC = 역내산 재료비 ÷ FOB = <b>${bu.toFixed(1)}%</b> (기준 ${f.thr}% 이상)`}
    else if(f.m==='korus'){pass=bu>=35||bd>=45;rvcTxt=`집적법 RVC = 역내산 재료비 ÷ FOB = <b>${bu.toFixed(1)}%</b> (기준 35%) · 공제법 RVC = <b>${bd.toFixed(1)}%</b> (기준 45%) — 둘 중 하나만 충족하면 됩니다`}
    else if(f.m==='maxnom'){pass=nom<=f.thr;rvcTxt=`비원산지 재료 비율 = <b>${nom.toFixed(1)}%</b> (기준 ${f.thr}% 이하)`}

    <div class="kpis"><div class="kpi"><span class="l">일반 관세 (MFN ${rt[0]}%)</span><span class="v">${usd(mfn)}</span></div><div class="kpi"><span class="l">FTA 특혜 ${rt[1]==null?'':'('+rt[1]+'%)'}</span><span class="v">${pref==null?'—':usd(pass?pref:mfn)}</span></div><div class="kpi"><span class="l">절감액</span><span class="v ${save>0&&pass?'up':''}">${pass?usd(save):'$0'}</span><span class="d">${pass||pref==null?'':'원산지 요건 미충족 시 MFN 적용'}</span></div></div>
    ${f.m?`<div class="stack"><h2 class="ct">원산지 결정기준</h2><div class="note" style="color:var(--ink-2)">${f.rule}</div><div>${rvcTxt}</div>
    <div class="meter" style="height:12px"><span style="width:${clamp(f.m==='maxnom'?nom:f.m==='bu'?bu:f.m==='korus'?Math.max(bd,bu):bd,0,100)}%;background:var(--${pass?'ok':'crit'})"></span></div><div class="note">막대 = 계산값, 기준 ${f.thr}%</div>

def('bep','가격 · 관세','손익분기 가격 계산기','환율과 물류비가 바뀔 때 목표 마진을 지키는 최소 판매가(USD)를 계산하고, 시나리오별 가격표를 만듭니다.',root=>{if(!PRODUCTS.length){root.innerHTML=head(CUR.g,CUR.title,CUR.desc)+`<section class="card">${emptyState('landed','등록된 제품이 없습니다','가격 계산을 하려면 먼저 제품을 등록하세요.','products')}</section>`;return}
  root.innerHTML=head('가격 · 관세','손익분기 가격 계산기',CUR.desc)+`
  <div class="row"><section class="card c-4 stack"><h2 class="ct">입력</h2><div class="form" style="grid-template-columns:1fr">
   <div class="field"><label for="bp">품목</label><select id="bp">${PRODUCTS.map(p=>`<option value="${p.id}">${p.short}</option>`).join('')}</select></div>
   <div class="field"><label for="bc">제조원가 (원/개)</label><input id="bc" type="number"></div>
   <div class="field"><label for="bl">개당 물류비 (원)</label><input id="bl" type="number"></div>
   <div class="field"><label for="bo">인증·마케팅 등 판관비 (%)</label><input id="bo" type="number" value="8"></div>
   <div class="field"><label for="bm">목표 영업이익률 (%)</label><input id="bm" type="number" value="15"></div>
   <div class="field"><label for="bx">현재 환율 (원/USD) <span class="note" id="bxv"></span></label><input id="bx" type="range" min="1200" max="1550" step="5" value="${Math.round(FX.USD.s[FX.USD.s.length-1])}"></div>
   <div class="field"><label for="bf">물류비 변동 <span class="note" id="bfv"></span></label><input id="bf" type="range" min="-30" max="80" step="5" value="0"></div></div></section>
  <section class="card c-8 stack" id="br"></section></div>`;
  const setP=()=>{const p=P($('#bp').value);$('#bc').value=p.cost;$('#bl').value=Math.round(p.cost*.045)};setP();
  function calc(){
    const p=P($('#bp').value),c=+$('#bc').value,l=+$('#bl').value,o=+$('#bo').value/100,m=+$('#bm').value/100,x=+$('#bx').value,fc=+$('#bf').value/100;
    $('#bxv').textContent=nf(x);$('#bfv').textContent=(fc>=0?'+':'')+Math.round(fc*100)+'%';
    const price=(fx,f)=>(c+l*(1+f))/fx/(1-o-m),bep=(c+l*(1+fc))/x/(1-o);
    const min=price(x,fc),cur=p.price,margin=(cur*x*(1-o)-(c+l*(1+fc)))/(cur*x);
    const fxs=[1250,1300,1350,1400,1450,1500],fcs=[-.2,0,.2,.4,.6];
    $('#br').innerHTML=`<div class="kpis"><div class="kpi"><span class="l">최소 판매가 (목표 마진 ${Math.round(m*100)}%)</span><span class="v">${usd(min,2)}</span></div><div class="kpi"><span class="l">손익분기 가격 (이익 0)</span><span class="v">${usd(bep,2)}</span></div><div class="kpi"><span class="l">현재 공급가 ${usd(cur)} 기준 마진</span><span class="v" style="color:var(--${margin>=m?'ok':margin>=0?'warn':'crit'})">${(margin*100).toFixed(1)}%</span><span class="d">${margin>=m?'목표 달성':margin>=0?'목표 미달, 가격 조정 검토':'적자 판매'}</span></div></div>
    <div class="card-h" style="margin:4px 0 0"><h2 class="ct">환율 × 물류비 시나리오별 최소 판매가 (USD)</h2><span class="sub">색: 현재 공급가 대비</span></div>
    <div class="tbl"><table class="data grid"><thead><tr><th>환율 \\ 물류비</th>${fcs.map(f=>`<th class="r">${f>=0?'+':''}${f*100}%</th>`).join('')}</tr></thead><tbody>
    ${fxs.map(fx=>`<tr><td class="mono">${nf(fx)}원</td>${fcs.map(f=>{const v=price(fx,f),d=v/cur;return `<td class="r mono" style="background:var(--${d<=.95?'ok':d<=1?'warn':'crit'}-soft);color:var(--${d<=.95?'ok':d<=1?'warn':'crit'})">${usd(v,p.price<200?2:0)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="chart-box" id="bch"></div><p class="note" style="margin:0">선: 환율 변화에 따른 최소 판매가 · 점선: 현재 공급가</p>`;
    charts=charts.filter(z=>z.el.id!=='bch');
    const xs=[];for(let v=1200;v<=1550;v+=10)xs.push(v);
    mount($('#bch'),el=>lineChart(el,{labels:xs.map(String),series:[{name:'최소 판매가',values:xs.map(v=>+price(v,fc).toFixed(2)),c:'--accent',area:true},{name:'현재 공급가',values:xs.map(()=>cur),c:'--c4',dash:true,w:1.5}],points:[{i:Math.round((x-1200)/10),v:+min.toFixed(2),c:'--accent'}],yFmt:v=>'$'+nf(v,p.price<200?1:0),tipFmt:v=>usd(v,2),tipLabel:i=>'환율 '+xs[i]+'원',h:200}));
  }
  $('#bp').oninput=()=>{setP();calc()};$$('#bc,#bl,#bo,#bm,#bx,#bf').forEach(e=>e.oninput=calc);calc();
});

const normK=s=>String(s).toLowerCase().replace(/[\s·,()\-/]/g,'');
function bigrams(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a}
function dice(a,b){if(!a||!b)return 0;if(a.length<2||b.length<2)return a===b?1:(b.includes(a)||a.includes(b)?.6:0);const A=bigrams(a),B=bigrams(b);let m=0;const used=new Array(B.length).fill(false);A.forEach(x=>{const i=B.findIndex((y,j)=>!used[j]&&y===x);if(i>=0){used[i]=true;m++}});return 2*m/(A.length+B.length)}
function hsSearch(q){
  const raw=q.trim();if(!raw)return{exact:HS.map(h=>({h,s:0})),near:[]};
  const digits=raw.replace(/[^0-9]/g,'');
  const toks=raw.toLowerCase().split(/[\s,·/]+/).map(normK).filter(Boolean);
  const scored=HS.map(h=>{const hay=normK(h[1]+h[2]+h[4]+h[3]),words=(h[1]+' '+h[2]+' '+h[4]).toLowerCase().split(/[\s,·()]+/).map(normK).filter(Boolean);
    let s=0,all=true,first=false;
    if(digits.length>=2&&h[0].replace('.','').startsWith(digits))s+=10;
    const full=normK(raw);if(full.length>=2&&normK(h[4]).includes(full))s+=3;
    toks.forEach((t,ti)=>{if(/^\d+$/.test(t))return;const w0=ti===0?1.5:1;if(hay.includes(t)){s+=4*w0;if(ti===0)first=true}else{const best=Math.max(0,...words.map(w=>Math.max(dice(t,w),w.includes(t)||t.includes(w)&&w.length>=2?.7:0)));if(best>=.5){s+=2*best*w0;if(ti===0)first=true}else all=false}});
    return{h,s,all,first}});
  let exact=scored.filter(x=>x.s>=4&&x.all||x.s>=10).sort((a,b)=>b.s-a.s);
  if(!exact.length&&toks.length>1)exact=scored.filter(x=>x.first&&x.s>=6).sort((a,b)=>b.s-a.s);
  const near=exact.length?[]:scored.filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,5);
  return{exact,near};
}

const API_BASE=window.AURELIS_API_BASE||null;
const LIVE={fx:null,news:null};
async function loadLive(kind){
  if(!API_BASE)return null;
  if(LIVE[kind])return LIVE[kind];
  try{const r=await fetch(`${API_BASE}/${kind}`,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(r.status);LIVE[kind]=await r.json();return LIVE[kind]}

}
function applyLiveFx(d){ // {date, rates:[{code:'USD',rate:1340.4,history:[...90개]}]}

  return true}

/* 4. tracking */
function routeMap(el,sel){
  const W=Math.max(el.clientWidth,260),H=Math.round(W*.46),pd2=14;
  const X=lon=>{const l=lon<-30?lon+360:lon;return pd2+(l+30)/360*(W-2*pd2)},Y=lat=>pd2+(72-lat)/(72+50)*(H-2*pd2);
  let s=`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect x="0" y="0" width="${W}" height="${H}" rx="14" style="fill:var(--surface-2)"/>`;
  for(let lon=-20;lon<330;lon+=15)for(let lat=-40;lat<=70;lat+=10)s+=`<circle cx="${X(lon>180?lon-360:lon)}" cy="${Y(lat)}" r="1" style="fill:var(--line)"/>`;
  s+=`<line x1="${pd2}" x2="${W-pd2}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--line);stroke-dasharray:2 4"/><text x="${W-pd2-2}" y="${Y(0)-4}" text-anchor="end">적도</text>`;
  const used=new Set();
  SHIPMENTS.forEach(sh=>{const a=PORTS[sh.from],b=PORTS[sh.to];if(!a||!b)return;used.add(sh.from);used.add(sh.to);const x1=X(a[2]),y1=Y(a[1]),x2=X(b[2]),y2=Y(b[1]);const on=sh._id===sel;
    const cx=(x1+x2)/2,cy=Math.min(y1,y2)-Math.abs(x2-x1)*.22-10;
    s+=`<path d="M${x1},${y1}Q${cx},${cy} ${x2},${y2}" style="fill:none;stroke:var(${on?(sh.delay?'--warn':'--accent'):'--line'});stroke-width:${on?2.6:1.3};${sh.mode==='해상'?'stroke-dasharray:5 4':''}"/>`;

    $('#apk').innerHTML=APPR_ST.map((s,i)=>`<div class="kpi"><span class="l">${s}</span><span class="v">${ps.reduce((a,p)=>a+cs.filter(c=>sv(p.id,c)===i).length,0)}</span><span class="d">${cont} · ${cs.length}개국</span></div>`).join('');

  function show(){const [pid,c]=cur,v=sv(pid,c),p=P(pid),k=key(pid,c);

/* 10. docs checklist — 대륙별 국가 선택 */
const DOC_KEY=c=>['DE','FR','IT','ES','NL','PL'].includes(c)?'EU':c;
def('docs','인허가 · 규제','필수 서류 체크리스트','수출국별 필수 서류 준비 상태를 기록합니다. 서류마다 메모와 만료일을 남길 수 있습니다.',root=>{
  const avail=MK.filter(c=>DOCS_C[DOC_KEY(c)]);
  let c=store.get('aur-docc','SA');if(!avail.includes(c))c='SA';
  root.innerHTML=head('인허가 · 규제','필수 서류 체크리스트',CUR.desc)+`<section class="card"><div class="cgroups" id="dc">${CONT_ORDER.map(g=>{const cs=avail.filter(x=>CONT[x]===g);return cs.length?`<div class="cgroup"><span class="cg-l">${g}</span><div class="hstack">${cs.map(k=>`<button class="chip" data-c="${k}" aria-pressed="${k===c}">${COUNTRY[k]}</button>`).join('')}</div></div>`:''}).join('')}</div></section>
  <div class="row"><section class="card c-8" id="dl"></section><section class="card c-4 stack" id="dsum"></section></div>`;
  const listOf=()=>[...DOCS_COMMON.map(d=>[...d,'공통']),...DOCS_C[DOC_KEY(c)].map(d=>[...d,DOC_KEY(c)==='EU'?'EU 공통':'국가 특화'])];
  function draw(){const list=listOf(),st=CHECKLIST[c]||(CHECKLIST[c]={});
    $('#dl').innerHTML=`<div class="card-h"><div><h2 class="ct">${COUNTRY[c]} 수출 서류</h2><div class="sub">${CONT[c]} · ${list.length}종 · 체크하면 자동 저장</div></div></div>`+list.map((d,i)=>{const s=st[i]||{};const o=typeof s==='boolean'?{ok:s}:s;return `<div class="chk"><input type="checkbox" data-i="${i}" ${o.ok?'checked':''} aria-label="${esc(d[0])} 준비 완료"><div><b style="font-weight:600">${d[0]}</b>${d[1]?`<div class="d">${d[1]}</div>`:''}
      <div class="doc-meta"><input class="mini-select" data-memo="${i}" placeholder="메모 (보관 위치, 담당자…)" value="${esc(o.memo||'')}"><input class="mini-select" type="date" data-exp="${i}" value="${esc(o.exp||'')}" title="서류 만료일"></div></div>${pill(d[2]==='공통'?'plain':'info plain',d[2])}</div>`}).join('');
    summary()}
  function summary(){const list=listOf(),st=CHECKLIST[c]||{};const ok=i=>(st[i]||{}).ok||st[i]===true;const done=list.filter((_,i)=>ok(i)).length,pct=Math.round(done/list.length*100);
    const expSoon=list.map((d,i)=>[d[0],(st[i]||{}).exp]).filter(x=>x[1]&&dleft(pd(x[1]))<=60);
    $('#dsum').innerHTML=`<h2 class="ct">준비율</h2><div class="hstack" style="gap:16px;flex-wrap:nowrap">${donut([{label:'완료',value:done||.001,c:'--accent'},{label:'남음',value:list.length-done||.001,c:'--sunken'}],120,`<text x="60" y="66" text-anchor="middle" style="fill:var(--ink);font-size:20px;font-weight:700">${pct}%</text>`)}<div><div class="big">${done}/${list.length}</div><div class="note">서류 준비 완료</div></div></div>
    ${pct<100?`<div class="callout warn"><b>남은 서류</b>${list.filter((_,i)=>!ok(i)).map(d=>d[0]).join(', ')}</div>`:`<div class="callout ok"><b>제출 준비 완료</b>모든 필수 서류가 준비되었습니다.</div>`}
    ${expSoon.length?`<div class="callout crit"><b>60일 내 만료되는 서류</b>${expSoon.map(x=>`${x[0]} (${ddl(dleft(pd(x[1])))})`).join(', ')}</div>`:''}
    <div class="note">다른 나라 준비율: ${avail.filter(x=>x!==c&&CHECKLIST[x]&&Object.keys(CHECKLIST[x]).length).map(x=>{const l=[...DOCS_COMMON,...DOCS_C[DOC_KEY(x)]].length,s=CHECKLIST[x],d=Object.keys(s).filter(i=>(s[i]||{}).ok||s[i]===true).length;return `${COUNTRY[x]} ${Math.round(d/l*100)}%`}).join(' · ')||'아직 기록 없음'}</div>`}
  const upd=(i,patch)=>{const st=CHECKLIST[c];const o=typeof st[i]==='object'&&st[i]?st[i]:{ok:!!st[i]};st[i]={...o,...patch};persist('checklist')};
  $('#dc').onclick=e=>{const b=e.target.closest('[data-c]');if(b){c=b.dataset.c;store.set('aur-docc',c);$$('#dc .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}};
  let memoT;
  root.addEventListener('change',e=>{const t=e.target;
    if(t.matches('.chk input[type=checkbox]')){upd(t.dataset.i,{ok:t.checked});summary()}
    if(t.dataset.exp!=null){upd(t.dataset.exp,{exp:t.value});summary()}});
  root.addEventListener('input',e=>{const t=e.target;if(t.dataset.memo!=null){clearTimeout(memoT);memoT=setTimeout(()=>{upd(t.dataset.memo,{memo:t.value.trim()});toast('메모를 저장했습니다.')},700)}});
  draw();
});

def('expiry','추적 · 품질','유통기한 임박 재고','창고와 대리점의 재고 로트를 기록하고, 남은 유효기간 순서로 조치할 재고를 찾습니다.',root=>{
  let f='전체';
  root.innerHTML=head('추적 · 품질','유통기한 임박 재고',CUR.desc)+`<div class="kpis" id="ek"></div>
  <section class="card"><div class="card-h"><div class="chips" id="ef">${['전체','만료','90일 이내','180일 이내'].map(t=>`<button class="chip" aria-pressed="${t===f}">${t}</button>`).join('')}</div>${addBtn('inventory')}</div><div id="et"></div></section>`;

  const act=r=>r.exp<0?pill('crit','폐기·손상 처리'):r.exp<=90?pill('warn',r.c==='KR'?'단기 수요처 우선 출하':'인근 대리점 재배치'):r.exp<=180?pill('info','프로모션 출하'):pill('ok','정상');
  const draw=()=>{if(!INV.length){$('#et').innerHTML=emptyState('expiry','등록된 재고 로트가 없습니다','로트 번호, 위치, 수량, 유효기한을 입력하면 FEFO 순서로 정리합니다.','inventory');return}
   const m={'전체':()=>true,'만료':r=>r.exp<0,'90일 이내':r=>r.exp>=0&&r.exp<=90,'180일 이내':r=>r.exp>=0&&r.exp<=180}[f];
   $('#et').innerHTML=`<div class="tbl"><table class="data"><thead><tr><th>로트</th><th>품목</th><th>위치</th><th class="r">수량</th><th>유효기한</th><th style="min-width:170px">남은 유효기간</th><th class="r">재고 가치</th><th>권장 조치</th><th></th></tr></thead><tbody>${rows.filter(m).sort((a,b)=>a.exp-b.exp).map(r=>`<tr class="click" data-rid="${r._id}"><td class="mono">${esc(r.lot)}</td><td>${esc(r.pp.short)}</td><td>${esc(r.loc)} <span class="code">${r.c}</span></td><td class="r">${nf(r.qty||0)}</td><td class="mono">${fd(pd(r.expDate))}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="meter" style="flex:1"><span style="width:${r.pct*100}%;background:var(--${r.exp<0?'crit':r.exp<=90?'warn':r.exp<=180?'accent':'ok'});border-radius:999px"></span></div><span class="mono note" style="width:52px;text-align:right">${ddl(r.exp)}</span></div></td><td class="r">${usd(r.val)}</td><td>${act(r)}</td><td class="r">${editBtn('inventory',r._id)}</td></tr>`).join('')||`<tr><td colspan="9" class="note">조건에 맞는 재고가 없습니다.</td></tr>`}</tbody></table></div>`};
  $('#ef').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;f=c.textContent;$$('#ef .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));draw()};
  root.onclick=e=>{const tr=e.target.closest('tr[data-rid]');if(tr&&!e.target.closest('[data-edit]')){const r=INV.find(x=>x._id===tr.dataset.rid);if(r)openEditor('inventory',r)}};

/* 18. tender */
def('tender','영업 · 채널','글로벌 입찰 & 낙찰가 분석','참여할 해외 입찰을 기록하고, 과거 낙찰가를 바탕으로 기대이익이 가장 큰 입찰가를 찾습니다.',root=>{
  if(!TENDERS.length){root.innerHTML=head('영업 · 채널','글로벌 입찰 & 낙찰가 분석',CUR.desc)+`<section class="card">${emptyState('tender','등록된 입찰이 없습니다','공고번호, 마감일, 예정 단가, 과거 낙찰가를 입력하면 최적 입찰가를 계산합니다.','tenders','첫 입찰 추가')}</section>`;return}
  let sel=TENDERS[0]._id;
  root.innerHTML=head('영업 · 채널','글로벌 입찰 & 낙찰가 분석',CUR.desc)+`
  <section class="card"><div class="card-h"><div><h2 class="ct">입찰 공고</h2><div class="sub">행을 누르면 시뮬레이터가 바뀝니다</div></div>${addBtn('tenders')}</div><div class="tbl"><table class="data"><thead><tr><th>공고번호</th><th>발주처</th><th>품목</th><th class="r">수량</th><th class="r">예정 단가</th><th>마감</th><th></th></tr></thead><tbody id="tt"></tbody></table></div></section>
  <div class="row"><section class="card c-5 stack" id="tin"></section><section class="card c-7 stack"><div class="card-h" style="margin:0"><h2 class="ct">입찰가별 기대이익</h2>${legend([['기대이익','--accent'],['낙찰 확률 (비율)','--c4']])}</div><div class="chart-box" id="tch"></div><div id="tout"></div></section></div>`;
  function model(t){const p=P(t.p),cost=(p.cost||0)/FX.USD.s[FX.USD.s.length-1]*1.12,past=t.past.length?t.past:[t.bud];const mu=past.reduce((a,b)=>a+b,0)/past.length,sd=Math.sqrt(past.reduce((a,b)=>a+(b-mu)**2,0)/past.length)||mu*.04;
    const prob=x=>1/(1+Math.exp((x-mu)/(sd*.7)));return{p,cost,mu,sd,past,prob,ev:x=>prob(x)*(x-cost)*(t.qty||0)}}
  function draw(keep){
    $('#tt').innerHTML=[...TENDERS].sort((a,b)=>a.d-b.d).map(t=>`<tr class="click ${t._id===sel?'sel':''}" data-id="${t._id}"><td class="mono">${esc(t.id)}</td><td>${esc(t.org)} <span class="code">${t.c}</span></td><td>${esc(t.item||P(t.p).short)}</td><td class="r">${nf(t.qty||0)}</td><td class="r">${usd(t.bud)}</td><td>${pill(t.d<0?'plain':t.d<=10?'crit':t.d<=21?'warn':'ok',t.d<0?'마감됨':ddl(t.d))}</td><td class="r">${editBtn('tenders',t._id)}</td></tr>`).join('');
    const t=TENDERS.find(x=>x._id===sel)||TENDERS[0],m=model(t);
    const lo=Math.max(0.01,Math.floor(Math.min(...m.past,t.bud)*.85)),hi=Math.ceil(Math.max(t.bud,...m.past)*1.02),stp=Math.max(+((hi-lo)/60).toFixed(2),.01);const xs=[];for(let i=0;lo+i*stp<=hi+1e-9;i++)xs.push(+(lo+i*stp).toFixed(2));
    let best=xs[0];xs.forEach(x=>{if(x<=t.bud&&m.ev(x)>m.ev(best))best=x});
    if(!keep)$('#tin').innerHTML=`<div><div class="eyebrow">${COUNTRY[t.c]||t.c} · ${esc(t.id)}</div><h2 class="ct" style="font-size:19px;margin-top:4px">${esc(t.item||P(t.p).short)} ${nf(t.qty||0)}개</h2></div>
     <dl class="kv"><dt>과거 낙찰가 평균</dt><dd>${usd(m.mu,2)} (${m.past.length}건)</dd><dt>과거 낙찰가 범위</dt><dd>${usd(Math.min(...m.past))} – ${usd(Math.max(...m.past))}</dd><dt>당사 원가 (물류 포함)</dt><dd>${usd(m.cost,2)}</dd><dt>예정 단가 (상한)</dt><dd>${usd(t.bud)}</dd></dl>
     <div class="field"><label for="tb">당사 입찰 단가 <b id="tbv" class="num" style="color:var(--ink)"></b></label><input id="tb" type="range" min="${lo}" max="${hi}" step="${+stp.toFixed(2)}" value="${best}"></div>
     <button class="btn" id="tbest">최적 입찰가로 설정</button>`;
    const cur=+$('#tb').value;$('#tbv').textContent=usd(cur,2);
    charts=charts.filter(z=>z.el.id!=='tch');
    const evs=xs.map(x=>m.ev(x)/1000),mxe=Math.max(...evs,0.001);
    mount($('#tch'),el=>lineChart(el,{labels:xs.map(x=>'$'+nf(x,x<10?1:0)),series:[{name:'기대이익',values:evs.map(v=>+v.toFixed(2)),c:'--accent',area:true},{name:'낙찰확률',values:xs.map(x=>+(m.prob(x)*mxe).toFixed(2)),c:'--c4',dash:true,w:1.6,noTip:true}],points:[{i:xs.indexOf(best),v:+(m.ev(best)/1000).toFixed(2),c:'--ok'}],yFmt:v=>(v<0?'-$':'$')+(Math.abs(v)>=1000?(Math.abs(v)/1000).toFixed(1).replace(/\.0$/,'')+'M':Math.abs(v)+'k'),tipFmt:v=>'$'+nf(v,1)+'k',tipLabel:i=>`입찰가 ${usd(xs[i],2)} · 낙찰확률 ${Math.round(m.prob(xs[i])*100)}%`,h:240}));
    const pc=m.prob(cur),mg=cur?(cur-m.cost)/cur:0;
    $('#tout').innerHTML=`<div class="kpis"><div class="kpi"><span class="l">낙찰 확률</span><span class="v">${Math.round(pc*100)}%</span></div><div class="kpi"><span class="l">낙찰 시 이익</span><span class="v">${usd((cur-m.cost)*(t.qty||0))}</span><span class="d">마진 ${(mg*100).toFixed(1)}%</span></div><div class="kpi"><span class="l">기대이익</span><span class="v">${usd(m.ev(cur))}</span></div></div>

const WS={mode:'local',db:null,uid:null,q:{},pending:0,
  lkey:n=>'aur-ws2-'+n,
  local(n){return store.get(this.lkey(n),undefined)},

  async connect(){try{const c=window.claude;if(!c||typeof c.use!=='function')return false;const [db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)return false;const id=await user.id();if(!id)return false;this.db=db;this.uid=id;this.mode='cloud';return true}catch(e){return false}},

    const run=async()=>{const body={v,at:new Date().toISOString()};
      try{await this.ref(n).set(body)}catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await this.ref(n).set(body);return}catch(_){}}

/* 콜드체인 업로드 기록을 COLD 목록에 합치기 */
const COLD_SAMPLE=COLD.slice();
function runs(t){const ev=[];let run=null;t.forEach((v,i)=>{const bad=v<2||v>8;if(bad&&!run)run={s:i,peak:v};if(bad&&run)run.peak=v>8?Math.max(run.peak,v):Math.min(run.peak,v);if(!bad&&run){run.e=i-1;ev.push(run);run=null}});if(run){run.e=t.length-1;ev.push(run)}return ev}
function rebuildCold(){COLD.splice(0,COLD.length,...COLDLOGS.map(l=>({id:l.name,sh:'업로드',route:l.route||'직접 업로드한 로거 기록',data:l,ex:runs(l.t),_id:l._id})),...(PROFILE.hideColdSamples?[]:COLD_SAMPLE))}
function parseLoggerCSV(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),ts=[],t=[],h=[];let hasH=false;
  for(const line of lines){const c=line.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,''));if(c.length<2)continue;const tv=parseFloat(c[1]);if(isNaN(tv))continue;
    const d=new Date(c[0].replace(' ','T'));ts.push(isNaN(d)?c[0]:`${fmd(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);t.push(+tv.toFixed(2));const hv=parseFloat(c[2]);h.push(isNaN(hv)?null:+hv.toFixed(1));if(!isNaN(hv))hasH=true}
  if(t.length<3)return null;
  let step=Math.ceil(t.length/2000),pick=(a)=>a.filter((_,i)=>i%step===0);
  return {ts:pick(ts),t:pick(t),h:hasH?pick(h).map(v=>v??0):null};
}

function startVitals(){
  const box=$('#vmon');if(!box)return;const ch=vitalChannels();const cvs=$$('canvas',box);const t0=performance.now();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tick=()=>{const tm=$('#vmTime');if(tm)tm.textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false})};tick();
  function draw(now){if(!box.isConnected){cancelAnimationFrame(vmRAF);vmRAF=null;return}
    cvs.forEach(cv=>{const c=ch[+cv.dataset.ch],dpr=devicePixelRatio||1,W=cv.clientWidth,H=64;if(!W)return;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
      const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
      g.fillStyle='rgba(120,200,190,.10)';for(let x=8;x<W;x+=16)for(let y=8;y<H;y+=16)g.fillRect(x,y,1,1);
      const d=c.data,n=d.length,lo=Math.min(...d),hi=Math.max(...d),pad=8,sc=(hi-lo)||1;
      const pts=c.kind==='ecg'?d.map((v,i)=>[i/(n-1)*W,H*.62-v*H*.48]):d.map((v,i)=>[i/(n-1)*W,H-pad-(v-lo)/sc*(H-pad*2)]);
      const p=reduce?1:((now-t0)/4200)%1,sx=p*W,gap=14;
      g.lineWidth=2;g.lineJoin='round';g.strokeStyle=c.col;
      g.globalAlpha=.28;g.beginPath();let st=false;pts.forEach(([x,y])=>{if(x<sx+gap)return;st?g.lineTo(x,y):(g.moveTo(x,y),st=true)});g.stroke();
      g.globalAlpha=1;g.shadowColor=c.col;g.shadowBlur=8;g.beginPath();st=false;pts.forEach(([x,y])=>{if(x>sx)return;st?g.lineTo(x,y):(g.moveTo(x,y),st=true)});g.stroke();g.shadowBlur=0;
      if(!reduce){const last=pts.filter(q=>q[0]<=sx).pop();if(last){g.fillStyle='#fff';g.beginPath();g.arc(last[0],last[1],2.6,0,7);g.fill()}}});
    if(!reduce)vmRAF=requestAnimationFrame(draw)}
  cancelAnimationFrame(vmRAF);vmRAF=requestAnimationFrame(draw);

}

function startHero(){const h=$('#hero');if(!h)return;const tr=$('#heroTrack'),n=tr.children.length;let i=0,play=!matchMedia('(prefers-reduced-motion: reduce)').matches,tm=null;
  const go=k=>{i=(k+n)%n;tr.style.transform=`translateX(-${i*100}%)`;$('#heroNum').textContent=String(i+1).padStart(2,'0');
    [...tr.children].forEach((s,j)=>{s.setAttribute('aria-hidden',j!==i);s.querySelectorAll('a').forEach(a=>a.tabIndex=j===i?0:-1)});$$('#heroDots button').forEach((d,j)=>d.toggleAttribute('aria-current',j===i))};
  const sched=()=>{clearInterval(tm);if(play)tm=setInterval(()=>{if(!h.isConnected)return clearInterval(tm);if(!h.matches(':hover'))go(i+1)},6500)};
  $('#heroPrev').onclick=()=>{go(i-1);sched()};$('#heroNext').onclick=()=>{go(i+1);sched()};
  $('#heroPlay').onclick=e=>{play=!play;e.currentTarget.textContent=play?'❚❚':'▶';e.currentTarget.setAttribute('aria-label',play?'자동 넘김 멈춤':'자동 넘김 시작');sched()};
  if(!play){$('#heroPlay').textContent='▶'}
  $('#heroDots').onclick=e=>{const b=e.target.closest('[data-i]');if(b){go(+b.dataset.i);sched()}};
  h.addEventListener('click',e=>{if(e.target.closest('[data-cmdk]')){e.preventDefault();cmdOpen()}});
  let sx=null;tr.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});tr.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){go(i+(dx<0?1:-1));sched()}sx=null});
  go(0);sched()}

const EXPO_F={'종합':'','병원':'','체외진단':'체외진단','치과':'치과','제조·부품':'','재활':'재활·보조','디지털':'디지털헬스'};

function expoWhen(x){
  if(x.none)return null;
  const T=+TODAY,d=s=>new Date(s+'T00:00:00');
  if(x.next){const a=d(x.next[0]),b=d(x.next[1]);if(+b>=T)return{a,b,sure:true}}
  if(x.last&&+d(x.last[1])>=T)return{a:d(x.last[0]),b:d(x.last[1]),sure:true};
  if(x.unk||!x.m.length)return null;
  /* 주기를 고려해 다음 개최 달을 추정 */
  const base=x.last?d(x.last[0]):(x.next?d(x.next[0]):null);let y=TODAY.getFullYear(),mo=x.m[0]-1;
  let cand=new Date(y,mo,15);if(+cand<T)cand=new Date(y+1,mo,15);
  if(/격년/.test(x.cyc)&&base){while((cand.getFullYear()-base.getFullYear())%2!==0)cand=new Date(cand.getFullYear()+1,mo,15)}
  return{a:cand,b:cand,sure:false};
}

def('expos','영업 · 채널','글로벌 의료기기 박람회','사이트에 나온 나라의 주요 의료기기 박람회를 월별 일정으로 모았습니다. 다음 회차 날짜와 준비 일정을 함께 봅니다.',root=>{
  let cont=store.get('aur-xcont','전체'),fil=store.get('aur-xf','전체'),more=false,prepSel=null;
  const mine=new Set(PRODUCTS.map(p=>catOf(p))),trade=new Set([...INVOICES.map(i=>i.c),...DIST.map(d=>d.c)]);
  const rel=x=>(x.f||[]).map(f=>EXPO_F[f]).filter(c=>c&&mine.has(c));
  root.innerHTML=head('영업 · 채널','글로벌 의료기기 박람회',CUR.desc)+`
  <div class="callout"><b>박람회가 중요한 이유</b>의료기기는 인허가와 현지 유통망이 있어야 팔리기 때문에, 대리점 후보·병원 구매 담당자·인증 컨설턴트를 한곳에서 만날 수 있는 박람회가 해외 영업의 출발점입니다. KOTRA·한국보건산업진흥원·한국의료기기산업협회가 주요 전시회에 한국관을 꾸리고 참가비 일부를 지원하니, 보통 전시 수개월 전에 열리는 모집 공고를 확인하세요.</div>
  <div class="kpis" id="xk"></div>
  <section class="card"><div class="card-h"><div><h2 class="ct">연간 개최 시기</h2><div class="sub">막대 = 보통 열리는 달 · 점 = 확정된 다음 회차 · 2026년 10월 8일 조사</div></div>
   <div class="hstack" style="gap:8px;flex-wrap:wrap"><div class="chips" id="xcont">${['전체',...CONT_ORDER,'국내'].map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cont}">${c}</button>`).join('')}</div>
   <select id="xf" style="height:34px">${['전체','종합','병원','체외진단','치과','제조·부품','재활','디지털'].map(f=>`<option ${f===fil?'selected':''}>${f}</option>`).join('')}</select></div></div>
   <div class="xcal-wrap"><div class="xcal" id="xcal"></div></div></section>
  <div class="row"><section class="card c-7"><div class="card-h"><div><h2 class="ct">다가오는 박람회</h2><div class="sub">오늘 기준 가까운 순 · '예상'은 지난 개최 패턴으로 추정한 시기</div></div></div><div id="xlist" class="stack" style="gap:10px"></div></section>
  <section class="card c-5 stack"><h2 class="ct">참가 준비 일정</h2><div class="note" id="xprepT"></div><ol class="steps" id="xprep"></ol>
   <div class="callout warn" style="margin-top:4px"><b>일정은 바뀔 수 있습니다</b>날짜·장소는 주최 측 사정으로 바뀌곤 합니다(예: 오사카 행사 가을 이동, CMEF 추계 개최 도시 순환). 참가 결정 전 공식 사이트에서 다시 확인하세요.</div></section></div>`;
  const okC=x=>cont==='전체'||(cont==='국내'?x.c==='KR':CONT[x.c]===cont);
  const okF=x=>fil==='전체'||(x.f||[]).includes(fil);
  const fmt=dt=>`${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
  const qL={o:'공식 확인',s:'2차 자료',p:'패턴 추정'};
  function draw(){
    const list=EXPOS.filter(x=>okC(x)&&okF(x));
    const real=EXPOS.filter(x=>!x.none),up=real.map(x=>({x,w:expoWhen(x)})).filter(o=>o.w);
    const in90=up.filter(o=>o.w.sure&&dleft(o.w.a)<=90&&dleft(o.w.b)>=0).length;
    const now=up.filter(o=>o.w.sure&&dleft(o.w.a)<=0&&dleft(o.w.b)>=0);
    $('#xk').innerHTML=`<div class="kpi"><span class="l">수록 박람회</span><span class="v">${real.length}개</span><span class="d">${new Set(real.map(x=>x.c)).size}개국</span></div><div class="kpi"><span class="l">90일 안에 개막</span><span class="v">${in90}개</span><span class="d">${now.length?'지금 진행 중: '+now.map(o=>o.x.n).join(', '):'진행 중인 행사 없음'}</span></div><div class="kpi"><span class="l">내 품목 관련</span><span class="v">${real.filter(x=>rel(x).length).length}개</span><span class="d">치과·체외진단 등 전문 전시</span></div><div class="kpi"><span class="l">거래 국가 개최</span><span class="v">${real.filter(x=>trade.has(x.c)).length}개</span><span class="d">대리점·인보이스가 있는 나라</span></div>`;
    const M=TODAY.getMonth();
    $('#xcal').innerHTML=`<div class="xr xh"><div class="xn">박람회</div>${Array.from({length:12},(_,i)=>`<div class="xm ${i===M?'cur':''}">${i+1}월</div>`).join('')}</div>`+
     list.map(x=>{if(x.none)return `<div class="xr"><div class="xn"><span class="code">${x.c}</span> ${COUNTRY[x.c]} <span class="note">· 전용 박람회 없음</span></div><div class="xnone">${x.tip}</div></div>`;
       const w=expoWhen(x),pm=w&&w.sure?w.a.getMonth():-1;
       return `<div class="xr"><div class="xn"><span class="code">${x.c}</span> <b>${esc(x.n)}</b><div class="note">${esc(x.city)} · ${esc(x.cyc)}</div></div>${Array.from({length:12},(_,i)=>`<div class="xc ${i===M?'cur':''}">${x.m.includes(i+1)?`<span class="xb ${x.unk?'unk':''} ${({'치과':'den','체외진단':'ivd','제조·부품':'mfg'})[(x.f||[])[0]]||''}"></span>`:''}${i===pm?`<i class="xd" title="${fmt(w.a)}"></i>`:''}</div>`).join('')}</div>`}).join('')+
     `<div class="legend" style="margin-top:12px"><span><i style="background:var(--accent)"></i>종합·병원</span><span><i style="background:var(--c2)"></i>체외진단</span><span><i style="background:var(--c4)"></i>치과</span><span><i style="background:var(--c7)"></i>제조·부품</span><span><i style="background:var(--ink)"></i>확정된 다음 회차</span></div>`;
    const ul=list.filter(x=>!x.none).map(x=>({x,w:expoWhen(x)})).sort((a,b)=>(a.w?+a.w.a:9e15)-(b.w?+b.w.a:9e15));
    $('#xlist').innerHTML=ul.slice(0,more?99:8).map(({x,w})=>{const dl=w?dleft(w.a):null,live=w&&w.sure&&dl<=0&&dleft(w.b)>=0,r=rel(x);
      const when=!w?'일정 미확인':w.sure?`${fmt(w.a)} – ${fmt(w.b).slice(5)}`:`${w.a.getFullYear()}년 ${w.a.getMonth()+1}월경 (예상)`;
      const badge=!w?pill('plain','확인 필요'):live?pill('ok','진행 중'):w.sure?pill(dl<=30?'crit':dl<=90?'warn':'info',ddl(dl)):pill('plain','예상');
      return `<article class="xcard ${live?'live':''}"><div class="hstack" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><div><span class="code">${x.c}</span> <b>${esc(x.n)}</b> <span class="note">${esc(x.ko)}</span></div>${badge}</div>
       <div class="xmeta"><span>${ic('licenses','ico sm')}${when}</span><span>${ic('market','ico sm')}${esc(x.city)} · ${esc(x.venue)}</span></div>
       <div class="hstack" style="gap:6px;flex-wrap:wrap;margin-top:6px">${(x.f||[]).map(f=>`<span class="pill plain">${f}</span>`).join('')}${r.length?`<span class="pill ok">내 품목: ${r.join('·')}</span>`:''}${trade.has(x.c)?'<span class="pill info">거래 중인 나라</span>':''}${x.risk?'<span class="pill crit">제재 확인</span>':''}<span class="note" style="margin-left:auto">${qL[x.q]}</span></div>
       ${x.tip?`<p class="note" style="margin:6px 0 0">${x.tip}</p>`:''}${x.url?`<a class="lnk" href="${x.url}" target="_blank" rel="noopener" style="font-size:13px">공식 사이트 ${ic('ext','ico sm')}</a>`:''}</article>`}).join('')+(ul.length>8&&!more?`<button class="btn" id="xmore" style="align-self:center">박람회 ${ul.length-8}개 더 보기</button>`:'')||'<p class="note">조건에 맞는 박람회가 없습니다.</p>';
    if($('#xmore'))$('#xmore').onclick=()=>{more=true;draw()};
    const cands=up.filter(o=>o.w.sure&&dleft(o.w.a)>7).sort((a,b)=>a.w.a-b.w.a);
    if(!prepSel||!cands.some(o=>o.x.n===prepSel))prepSel=(cands.find(o=>dleft(o.w.a)>=150)||cands[0]||{x:{}}).x.n;
    const nx=cands.find(o=>o.x.n===prepSel);
    if(nx){const a=nx.w.a,st=(t,d,k)=>{const dt=new Date(+a-(k===6?-7:[0,180,120,60,30,7][k])*864e5),past=dleft(dt)<0;return `<li style="${past?'opacity:.55':''}"><span class="sn">${k}</span><div><b>${t}</b><div class="note" style="color:var(--ink-2)">${d}</div></div><span class="pill ${past?'plain':'info'}">${past?'지남 · ':''}${fmt(dt).slice(2)}</span></li>`};
      $('#xprepT').innerHTML=`<label class="note" for="xps">기준 박람회</label><select id="xps" style="width:100%;height:38px;margin:4px 0 6px">${cands.map(o=>`<option ${o.x.n===prepSel?'selected':''} value="${esc(o.x.n)}">${fmt(o.w.a).slice(2)} · ${esc(o.x.n)} (${COUNTRY[o.x.c]})</option>`).join('')}</select>개막일 ${fmt(a)} 기준으로 거꾸로 계산한 일정입니다. 지난 단계는 흐리게 표시됩니다.`;
      $('#xps').onchange=e=>{prepSel=e.target.value;draw()};
      $('#xprep').innerHTML=[['참가 결정·한국관 신청','KOTRA·보건산업진흥원 한국관 모집 공고 확인, 부스 위치 확보',1],['인허가·자료 준비','수출국 인증 현황 정리, 영문 카탈로그·IFU·인증서 사본 준비',2],['바이어 사전 매칭','대리점 후보 리스트업, 상담 일정 예약(주최 측 매칭 서비스 활용)',3],['물류·샘플 발송','전시품 ATA 까네(일시 수출입 통관) 또는 샘플 운송 확정',4],['현장 운영 점검','상담 기록 양식, 가격표(인코텀즈별), 명함·QR 준비',5],['사후 관리','1주 안에 상담 내용 정리·견적 발송, 노트에 후속 일정 기록',6]].map(([t,d,k])=>st(t,d,k)).join('')}
  }
  $('#xcont').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cont=b.dataset.c;store.set('aur-xcont',cont);more=false;$$('#xcont .chip').forEach(c=>c.setAttribute('aria-pressed',c===b));draw()};
  $('#xf').onchange=e=>{fil=e.target.value;store.set('aur-xf',fil);draw()};
  draw();
},()=>EXPOS.filter(x=>{const w=expoWhen(x);return w&&w.sure&&dleft(w.a)<=30&&dleft(w.b)>=0}).length);

const NAV_ORDER=['dashboard','usa','fx','market','notes','products','profile','tracking','coldchain','disposal','carriers','licenses','approvals','docs','udi','recall','expiry','landed','fta','bep','hs','expos','tender','distributor','invoice','integrations'];
MODS.sort((a,b)=>NAV_ORDER.indexOf(a.id)-NAV_ORDER.indexOf(b.id));
const GROUPS=['개요','내 기록','물류 · 콜드체인','인허가 · 규제','추적 · 품질','가격 · 관세','영업 · 채널','무역 서류','설정'].filter(g=>MODS.some(m=>m.g===g));
let CUR=MODS[0];
function buildNav(){$('#nav').innerHTML=GROUPS.map(g=>`<div class="nav-group"><h6>${g}</h6>${MODS.filter(m=>m.g===g).map(m=>{let c=0;try{c=m.badge?m.badge():0}catch(e){}return `<a class="nav-item" href="#${m.id}" data-id="${m.id}" ${m.id===CUR.id?'aria-current="page"':''}>${ic(m.id)}<span>${m.title}</span>${c?`<span class="cnt ${['licenses','coldchain','notes'].includes(m.id)?'':'w'}">${c}</span>`:''}</a>`}).join('')}</div>`).join('')}
/* 모바일에서 칸이 많은 표를 카드 형태로 보여 주기 위해 각 칸에 머리글 이름을 붙입니다 */
function cardify(){document.querySelectorAll('#view table.data:not(.heat):not(.mx):not(.grid)').forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());if(hs.length<5)return;t.classList.add('cards');t.querySelectorAll('tbody tr').forEach(tr=>{if(tr.dataset.cd===String(tr.cells.length))return;tr.dataset.cd=tr.cells.length;if(tr.cells.length!==hs.length)return;[...tr.cells].forEach((td,i)=>td.setAttribute('data-label',hs[i]||''))})})}
let cardQ=0;new MutationObserver(()=>{if(cardQ)return;cardQ=requestAnimationFrame(()=>{cardQ=0;cardify()})}).observe(document.getElementById('view')||document.body,{childList:true,subtree:true});
function route(keep){
  const id=(location.hash||'#dashboard').slice(1),m=MODS.find(x=>x.id===id)||MODS[0];
  CUR=m;charts=[];const v=$('#view');v.innerHTML='';const root=document.createElement('div');root.className='stack'+(keep?'':' view-in');root.style.gap='20px';v.appendChild(root);
  try{m.render(root)}catch(err){console.error(err);root.innerHTML=head(m.g,m.title,m.desc)+`<div class="callout crit"><b>이 화면을 그리지 못했습니다</b>입력한 기록 중 형식이 맞지 않는 값이 있을 수 있습니다. 해당 기록을 수정하거나 "내 정보 · 데이터 관리"에서 백업 후 되돌려 보세요.</div>`}
  $$('.nav-item').forEach(a=>{if(a.dataset.id===m.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#crumbs').innerHTML=`<span class="g">${m.g}</span><span class="g">/</span><b>${m.title}</b>`;
  closeSide();if(!keep)window.scrollTo(0,0);store.set('aur-last',m.id);
}
function openSide(){$('#side').classList.add('open');$('#scrim').hidden=false}
function closeSide(){$('#side').classList.remove('open');$('#scrim').hidden=true}

/* 부팅: 예시 → 이 브라우저 기록 → (가능하면) 계정 클라우드 기록 */
makeSeeds();
ALL_COLS.forEach(n=>applyCol(n,JSON.parse(JSON.stringify(SEED[n]))));
let hadLocal=false;ALL_COLS.forEach(n=>{const v=WS.local(n);if(v!==undefined){hadLocal=true;applyCol(n,v)}});
rebuildCold();applyBrand();
buildNav();
$('#mFlip').innerHTML=mascotSVG();setupMascot();
addEventListener('hashchange',()=>route());
if(!location.hash){const last=store.get('aur-last',null);if(last&&MODS.find(m=>m.id===last))history.replaceState(null,'','#'+last)}
route();saveStatus();
$('#menuBtn').onclick=openSide;$('#scrim').onclick=closeSide;

const connectP=WS.connect().then(async ok=>{
  if(!ok){saveStatus();return}
  let changed=false;
  for(const n of ALL_COLS){try{const v=await WS.pull(n);if(v!==undefined){applyCol(n,v);store.set(WS.lkey(n),v);changed=true}else if(WS.local(n)!==undefined){WS.save(n)}}catch(e){}}
  saveStatus();if(changed){rebuildCold();applyBrand();buildNav();route(true)}
});

/* 편집 시트 */
$('#shF').onsubmit=submitEditor;$('#shSave').onclick=submitEditor;$('#shDel').onclick=deleteEditing;
$$('[data-close-sheet]').forEach(b=>b.onclick=closeEditor);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeEditor()});

/* 빠른 기록 */
const QA=[['notes','업무 노트','notes'],['invoices','인보이스','fx'],['shipments','선적','tracking'],['licenses','인허가','licenses'],['inventory','재고 로트','expiry'],['distributors','대리점','distributor'],['tenders','입찰','tender'],['products','제품','products'],['monthly','월별 실적','dashboard']];
$('#qaMenu').innerHTML=QA.map(([c,l,i])=>`<button data-qa="${c}">${ic(i)}<span>${l}</span></button>`).join('');
$('#qaBtn').onclick=e=>{e.stopPropagation();$('#qaMenu').hidden=!$('#qaMenu').hidden};
$('#qaMenu').onclick=e=>{const b=e.target.closest('[data-qa]');if(!b)return;$('#qaMenu').hidden=true;const c=b.dataset.qa;
  const go={notes:'notes',invoices:'dashboard',shipments:'tracking',licenses:'licenses',inventory:'expiry',distributors:'distributor',tenders:'tender',products:'products',monthly:'dashboard'}[c];
  openEditor(c,null,{after:rec=>{if(c==='shipments')window.__selShip=rec._id;buildNav();if((location.hash||'#dashboard').slice(1)===go)route(true);else location.hash=go}})};
document.addEventListener('click',e=>{if(!e.target.closest('.qa'))$('#qaMenu').hidden=true});

/* 밝은/어두운 화면 */
function curTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function themeIcon(){$('#themeBtn').innerHTML=ic(curTheme()==='dark'?'sun':'moon')}
{const tp=store.get('aur-theme',null);if(tp)document.documentElement.dataset.theme=tp}
themeIcon();
$('#themeBtn').onclick=()=>{const t=curTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=t;store.set('aur-theme',t);themeIcon();charts.forEach(c=>c.el.isConnected&&c.draw(c.el))};

/* 명령 팔레트 */
const cmdk=$('#cmdk'),cq=$('#cmdq'),cl=$('#cmdl');let cIdx=0,cRes=[];
function cmdRender(){const s=cq.value.trim().toLowerCase();cRes=MODS.filter(m=>!s||(m.title+m.desc+m.g+m.id).toLowerCase().includes(s));cIdx=Math.min(cIdx,Math.max(cRes.length-1,0));
  cl.innerHTML=cRes.map((m,i)=>`<button data-id="${m.id}" class="${i===cIdx?'on':''}">${ic(m.id)}<span>${m.title}</span><small>${m.g}</small></button>`).join('')||'<p class="note" style="padding:12px">일치하는 기능이 없습니다.</p>'}
function cmdOpen(){cmdk.hidden=false;cq.value='';cIdx=0;cmdRender();setTimeout(()=>cq.focus(),0)}
function cmdClose(){cmdk.hidden=true}
function cmdGo(id){cmdClose();location.hash=id}
$('#kbtn').onclick=cmdOpen;cq.oninput=()=>{cIdx=0;cmdRender()};
cl.onclick=e=>{const b=e.target.closest('button');if(b)cmdGo(b.dataset.id)};
cmdk.onclick=e=>{if(e.target===cmdk)cmdClose()};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmdk.hidden?cmdOpen():cmdClose();return}
  if(e.key==='Escape'){if(!$('#sheet').hidden){closeEditor();return}if(!$('#onb').hidden)return;}
  if(cmdk.hidden)return;
  if(e.key==='Escape')cmdClose();
  if(e.key==='ArrowDown'){e.preventDefault();cIdx=Math.min(cIdx+1,cRes.length-1);cmdRender()}
  if(e.key==='ArrowUp'){e.preventDefault();cIdx=Math.max(cIdx-1,0);cmdRender()}
  if(e.key==='Enter'&&cRes[cIdx])cmdGo(cRes[cIdx].id)});

/* 첫 방문 안내 */
Promise.race([connectP,new Promise(r=>setTimeout(r,2500))]).then(()=>{
  if(PROFILE.onboarded)return;
  const o=$('#onb');o.hidden=false;$('#onbCo').value=PROFILE.company||'';$('#onbWhere').textContent=WS.mode==='cloud'?'입력한 기록은 내 claude.ai 계정에 저장되어 다른 기기에서도 이어서 볼 수 있고, 이 페이지를 함께 보는 다른 사람에게는 보이지 않습니다.':'입력한 기록은 이 브라우저에 저장됩니다. 다른 기기로 옮기려면 "내 정보 · 데이터 관리"에서 백업 파일을 받으세요.';
  let startMode='sample';$('#onbMode').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;startMode=b.dataset.mode;$$('#onbMode [data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('#onbGo').onclick=()=>{PROFILE.person=$('#onbName').value.trim();PROFILE.company=$('#onbCo').value.trim()||PROFILE.company;PROFILE.onboarded=true;
    if(startMode==='empty'){ALL_COLS.forEach(n=>{if(ARRS[n])applyCol(n,[]);else if(n==='checklist'||n==='apprMemo')applyCol(n,{});else if(n==='approvals')applyCol(n,{})});PROFILE.hideColdSamples=true;rebuildCold();ALL_COLS.forEach(n=>{if(n!=='profile')WS.save(n)})}
    persist('profile');o.hidden=true;applyBrand();buildNav();const here=(location.hash||'#dashboard').slice(1);location.hash=startMode==='empty'?'products':(MODS.some(m=>m.id===here)?here:'dashboard');route(true);toast(startMode==='empty'?'먼저 수출하는 제품을 등록해 보세요.':'예시 데이터로 시작합니다. 언제든 수정하거나 지울 수 있습니다.')};
});

/* live data boot */
loadLive('fx').then(d=>{if(applyLiveFx(d)&&['fx','dashboard','bep'].includes((location.hash||'#dashboard').slice(1)))route(true)});

</script>
