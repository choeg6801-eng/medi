<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="brand/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/mark-512.png">
<meta name="theme-color" content="#0C63BF">
<title>Aurelis Trade Console</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
:root{
  --bg:#F1F5F8; --surface:#FFFFFF; --surface-2:#F7FAFC; --sunken:#EAF0F5; --line:#DCE4EC; --line-2:#E9EEF3;
  --ink:#0B1B2C; --ink-2:#3B4C61; --muted:#617187;
  --accent:#0C63BF; --accent-2:#5B9BE0; --accent-soft:#E8F1FB; --accent-ink:#FFFFFF;
  --mint:#0E9C97; --mint-soft:#E1F4F2;
  --cold:#0A84C6; --cold-soft:#E3F2FA;
  --ok:#0F8654; --ok-soft:#E2F3EA; --warn:#B86E00; --warn-soft:#FCF0DA; --crit:#CF3940; --crit-soft:#FBE9E9;
  --c1:#0C63BF; --c2:#0E9C97; --c3:#7566D6; --c4:#E0962B; --c5:#D45F88; --c6:#3AA0D8; --c7:#A2B0C1;
  --heat-0:#EDF3F8; --heat-1:#0C63BF;
  --brand-a:#16B3AE; --brand-b:#0B57B8;
  --shadow-sm:0 1px 2px rgba(11,27,44,.04),0 1px 3px rgba(11,27,44,.05);
  --shadow-md:0 2px 4px rgba(11,27,44,.04),0 14px 34px -10px rgba(11,27,44,.16);
  --glass:rgba(241,245,248,.8);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#091017; --surface:#101922; --surface-2:#14202B; --sunken:#0C141C; --line:#1F2C39; --line-2:#192531;
  --ink:#E6EEF6; --ink-2:#A8B7C8; --muted:#7F8EA3;
  --accent:#4E9DF0; --accent-2:#80B8F5; --accent-soft:#122638; --accent-ink:#06121F;
  --mint:#2FC6BD; --mint-soft:#0D2A29; --cold:#4DB3F0; --cold-soft:#0E2537;
  --ok:#3DC98B; --ok-soft:#0E2A1E; --warn:#F0AF4A; --warn-soft:#2E230E; --crit:#F27A7E; --crit-soft:#341517;
  --c1:#4E9DF0; --c2:#2FC6BD; --c3:#A391F7; --c4:#F0AF4A; --c5:#EF8AAB; --c6:#5DBAF0; --c7:#5A6A7E;
  --heat-0:#14202B; --heat-1:#4E9DF0;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 16px 40px -12px rgba(0,0,0,.6);
  --glass:rgba(9,16,23,.78);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#091017; --surface:#101922; --surface-2:#14202B; --sunken:#0C141C; --line:#1F2C39; --line-2:#192531;
  --ink:#E6EEF6; --ink-2:#A8B7C8; --muted:#7F8EA3;
  --accent:#4E9DF0; --accent-2:#80B8F5; --accent-soft:#122638; --accent-ink:#06121F;
  --mint:#2FC6BD; --mint-soft:#0D2A29; --cold:#4DB3F0; --cold-soft:#0E2537;
  --ok:#3DC98B; --ok-soft:#0E2A1E; --warn:#F0AF4A; --warn-soft:#2E230E; --crit:#F27A7E; --crit-soft:#341517;
  --c1:#4E9DF0; --c2:#2FC6BD; --c3:#A391F7; --c4:#F0AF4A; --c5:#EF8AAB; --c6:#5DBAF0; --c7:#5A6A7E;
  --heat-0:#14202B; --heat-1:#4E9DF0;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 16px 40px -12px rgba(0,0,0,.6);
  --glass:rgba(9,16,23,.78);
}
*{box-sizing:border-box}
html,body{height:100%}
body{word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:0;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 20px;display:flex;flex-direction:column;gap:22px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px}
.brand-mark{width:38px;height:38px;flex:none;display:block;filter:drop-shadow(0 6px 12px rgba(11,87,184,.22))}
.brand-mark svg{width:100%;height:100%;display:block}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:20px}
.nav-group{display:flex;flex-direction:column;gap:1px}
.nav-group h6{margin:0 0 6px;padding:0 10px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.nav-item span:not(.cnt){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s,color .15s}
.nav-item .ico{color:var(--muted);transition:color .15s}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item[aria-current="page"] .ico{color:var(--accent)}
.nav-item .cnt{margin-left:auto;min-width:20px;text-align:center;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--crit-soft);color:var(--crit)}
.nav-item .cnt.w{background:var(--warn-soft);color:var(--warn)}
.side-card{margin-top:auto;border-radius:14px;padding:14px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.side-card b{color:var(--ink);font-size:13px}
.side-card a{color:var(--accent);font-weight:600;text-decoration:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);padding-block:12px;padding-inline:clamp(16px,3vw,36px);display:flex;align-items:center;gap:12px;min-height:64px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;place-items:center;cursor:pointer}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.kbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 10px 0 12px;color:var(--muted);cursor:pointer;min-width:220px;box-shadow:var(--shadow-sm)}
.kbtn span{flex:1;text-align:left;font-size:13px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--surface-2)}
.status{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.status i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.status.live i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft)}
.content{padding-block:28px 64px;padding-inline:clamp(16px,3vw,36px);width:100%;max-width:1480px;display:flex;flex-direction:column;gap:20px}
.view-in{animation:vin .28s cubic-bezier(.2,.7,.2,1)}
@keyframes vin{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:1024px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:284px;z-index:60;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:var(--shadow-md)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(9,12,17,.35);z-index:55}
  .menu-btn{display:grid}
}
@media (max-width:720px){.kbtn{min-width:0}.kbtn span,.kbtn kbd,.status.hide-sm,.crumbs .g{display:none}}
@media (max-width:900px){.status.hide-sm{width:32px;padding:0;justify-content:center;font-size:0;gap:0}.kbtn kbd{display:none}}

/* ---------- command palette ---------- */
.cmdk{position:fixed;inset:0;z-index:90;background:rgba(9,12,17,.38);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.cmdk-box{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-md);overflow:hidden}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);color:var(--muted)}
.cmdk-in input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--ink)}
.cmdk-list{max-height:52vh;overflow:auto;padding:8px}
.cmdk-list button{display:flex;width:100%;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:10px;text-align:left;cursor:pointer;color:var(--ink)}
.cmdk-list button .ico{color:var(--muted)}
.cmdk-list button small{margin-left:auto;color:var(--muted);font-size:12px}
.cmdk-list button.on,.cmdk-list button:hover{background:var(--accent-soft)}
.cmdk-list button.on .ico{color:var(--accent)}

/* ---------- headings ---------- */
.mod-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mod-head .mh>div{display:flex;flex-direction:column;gap:6px;max-width:74ch}
.mod-head .crumb{font-size:12.5px;font-weight:600;color:var(--accent)}
.mod-head h1{margin:0;font-size:30px;line-height:1.2;font-weight:720;letter-spacing:-.03em;text-wrap:balance}
.mod-head p{margin:0;color:var(--ink-2);font-size:14.5px;text-wrap:pretty}
h2.ct{margin:0;font-size:15.5px;font-weight:680;letter-spacing:-.015em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted)}

/* ---------- layout ---------- */
.row{display:grid;gap:20px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c-3{grid-column:span 3}.c-4{grid-column:span 4}.c-5{grid-column:span 5}.c-6{grid-column:span 6}.c-7{grid-column:span 7}.c-8{grid-column:span 8}.c-12{grid-column:span 12}
@media (max-width:1240px){.c-3{grid-column:span 6}.c-4,.c-5,.c-6,.c-7,.c-8{grid-column:span 12}}
@media (max-width:620px){.c-3{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0;box-shadow:var(--shadow-sm)}
.stack{display:flex;flex-direction:column;gap:14px}
.hstack{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- brief ---------- */
.brief{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.brief::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 0% 0%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 70%),radial-gradient(420px 200px at 100% 100%,color-mix(in srgb,var(--mint) 10%,transparent),transparent 70%);pointer-events:none}
.brief>*{position:relative}
.brief h2{margin:4px 0 8px;font-size:22px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.brief p{margin:0;color:var(--ink-2)}
.brief-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.brief-stats a{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .15s,transform .15s}
.brief-stats a:hover{border-color:var(--accent);transform:translateY(-1px)}
.brief-stats b{font-size:22px;font-weight:720;letter-spacing:-.02em}
.brief-stats span{font-size:12px;color:var(--muted)}
@media (max-width:900px){.brief{grid-template-columns:1fr;padding:22px}}

/* ---------- KPI ---------- */
.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.kpis:has(> :nth-child(4):last-child){grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis:has(> :nth-child(3):last-child){grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:1560px){.kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:620px){.kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{container-type:inline-size}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);min-width:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-size:min(28px,17cqi);font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.15}
.kpi .d{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi .spk{margin-top:6px}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:650;padding:1px 7px;border-radius:999px}
.delta.up,.up.delta{background:var(--ok-soft);color:var(--ok)}
.delta.down{background:var(--crit-soft);color:var(--crit)}
.up{color:var(--ok)}.down{color:var(--crit)}
button.kpi{text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
button.kpi:hover{border-color:var(--accent-2)}
button.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- badges ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--sunken);color:var(--ink-2);line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.cold{background:var(--cold-soft);color:var(--cold)}
.pill.plain::before{display:none}
.code{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--sunken);color:var(--ink-2);white-space:nowrap;border:0}

/* ---------- tables ---------- */
.tbl{overflow-x:auto;border:1px solid var(--line-2);border-radius:14px;background:linear-gradient(90deg,var(--surface) 30%,transparent) left/28px 100% no-repeat local,linear-gradient(270deg,var(--surface) 30%,transparent) right/28px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,rgba(11,27,44,.16),transparent) left/12px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,rgba(11,27,44,.16),transparent) right/12px 100% no-repeat scroll;background-color:var(--surface)}
@media (max-width:620px){table.data:has(th:nth-child(5)):not(.cards){min-width:600px}table.data:has(th:nth-child(4)):not(:has(th:nth-child(5))):not(.cards){min-width:440px}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.us-stats b{font-size:19px}}
@media (min-width:621px) and (max-width:900px){table.data.cards tr{display:grid!important;grid-template-columns:1fr 1fr;column-gap:28px}table.data.cards td:first-child{grid-column:1/-1}}
@media (max-width:900px){
 .tbl:has(>table.cards){background:var(--surface)}
 table.cards,table.cards tbody{display:block;min-width:0}
 table.cards thead{display:none}
 table.data.cards tr{display:block;position:relative;padding:12px 14px 10px;border-bottom:1px solid var(--line-2)}
 table.cards tbody tr:last-child{border-bottom:0}
 table.data.cards td{display:block;overflow:hidden;padding:4px 0;border:0;text-align:right;min-width:0!important;white-space:normal}
 table.cards td::before{content:attr(data-label);float:left;margin:2px 14px 0 0;max-width:42%;text-align:left;font-size:12px;font-weight:500;color:var(--muted)}
 table.cards td[data-label=""]::before,table.cards td:not([data-label])::before{display:none}
 table.cards td:first-child{text-align:left;font-size:15px;font-weight:650;padding:0 0 6px}
 table.cards td:first-child::before{display:none}
 table.cards td:empty{display:none}
 table.cards td>.hstack{justify-content:flex-end}
 table.cards td:first-child>.hstack{justify-content:flex-start}
 table.data.cards td:last-child:has(> .icon-btn:only-child),table.data.cards td:last-child:has(> button:only-child){position:absolute;top:8px;right:10px;padding:0}
 table.data.cards tr:has(td:last-child > .icon-btn:only-child) td:first-child,table.data.cards tr:has(td:last-child > button:only-child) td:first-child{padding-right:40px}
 table.cards tr.sel{box-shadow:inset 3px 0 0 var(--accent)}
}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.data th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line-2);white-space:nowrap}
table.data td{padding:13px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data td.mono{white-space:nowrap}
table.data td.r,table.data th.r{text-align:right;font-variant-numeric:tabular-nums}
table.data tbody tr{transition:background .12s}
table.data tbody tr.click{cursor:pointer}
table.data tbody tr.click:hover{background:var(--surface-2)}
table.data tbody tr.sel{background:var(--accent-soft)}
table.data tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* ---------- forms ---------- */
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:550}
.field input:not([type=range]):not([type=checkbox]),.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s;box-shadow:var(--shadow-sm)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow-sm);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent-2);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--accent)}
.btn.pri:hover{filter:brightness(1.07);color:var(--accent-ink)}
.chips{display:inline-flex;gap:2px;flex-wrap:wrap;padding:3px;border-radius:12px;background:var(--sunken)}
.chip{border:0;background:none;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:550;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.hstack .chip{background:var(--sunken)}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;margin-top:2px}

/* ---------- charts ---------- */
.chart-box{position:relative;width:100%}
svg.chart{display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11.5px;font-family:var(--sans)}
svg.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-md);font-size:12.5px;padding:8px 11px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums;z-index:3;line-height:1.6}
.tip b{font-weight:650}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ---------- misc ---------- */
.alert-list{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.alert:last-child{border-bottom:0}
.alert .bar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.alert .bar .ico{width:16px;height:16px}
.alert .t{font-size:13.5px;font-weight:550}
.alert .s{font-size:12.5px;color:var(--muted)}
.alert a{font-size:12.5px;color:var(--accent);text-decoration:none;white-space:nowrap;font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
.callout{border-radius:14px;padding:14px 16px;background:var(--accent-soft);color:var(--ink);font-size:13.5px;border:1px solid color-mix(in srgb,var(--accent) 14%,transparent)}
.callout.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 18%,transparent)}
.callout.crit{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 18%,transparent)}
.callout.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 18%,transparent)}
.callout b{display:block;margin-bottom:3px;font-weight:680}
.big{font-size:34px;font-weight:740;font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:1.15}
.meter{height:8px;border-radius:999px;background:var(--sunken);overflow:hidden;display:flex}
.meter span{display:block;height:100%}
.meter span:first-child{border-radius:999px 0 0 999px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:550}
.divider{height:1px;background:var(--line-2);margin:4px 0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:9px;top:16px;bottom:-2px;width:2px;border-radius:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--accent)}
.tl .dot{width:14px;height:14px;border-radius:50%;margin:3px;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1}
.tl li.done .dot{background:var(--accent);border-color:var(--accent)}
.tl li.cur .dot{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tl li.cur.late .dot{border-color:var(--warn);box-shadow:0 0 0 5px var(--warn-soft)}
.tl .n{font-weight:600}
.tl .dt{font-size:12px;color:var(--muted);font-family:var(--mono)}
.tl li.pend .n{color:var(--muted);font-weight:500}

table.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-size:13px;padding:12px 6px}
.mx td.cell{padding:6px}
.mx .st{display:block;border-radius:9px;padding:7px 8px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;border:0;white-space:nowrap;transition:transform .12s}
.mx .st:hover{transform:translateY(-1px)}
.st-0{background:var(--sunken);color:var(--muted)}
.st-1{background:var(--cold-soft);color:var(--cold)}
.st-2{background:color-mix(in srgb,var(--c3) 14%,transparent);color:var(--c3)}
.st-3{background:var(--warn-soft);color:var(--warn)}
.st-4{background:var(--crit-soft);color:var(--crit)}
.st-5{background:var(--ok-soft);color:var(--ok)}

.tree{list-style:none;margin:0;padding-left:0}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:2px solid var(--line-2);margin-left:8px}
.tree li{padding:6px 0}
.node{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.node .ty{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--sunken);border-radius:6px;padding:1px 7px}

.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:start;padding:13px 4px;border-bottom:1px solid var(--line-2);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .d{font-size:12.5px;color:var(--muted)}

.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:32px;font-size:12px;line-height:1.5;font-family:var(--sans);overflow-x:auto;box-shadow:var(--shadow-md)}
.doc h3{margin:0 0 4px;text-align:center;font-size:18px;letter-spacing:.16em;font-weight:700}
.doc .sub{text-align:center;color:#555;margin-bottom:16px;font-size:11px}
.doc table{width:100%;border-collapse:collapse;margin-top:8px}
.doc td,.doc th{border:1px solid #B8BEC8;padding:6px 8px;vertical-align:top}
.doc td.r,.doc th.r{white-space:nowrap}
.doc th{background:#F1F4F8;font-weight:600;text-align:left;font-size:11px}
.doc .r{text-align:right;font-variant-numeric:tabular-nums}
.item-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.8fr) minmax(0,1fr) 34px;gap:8px;align-items:end}
.item-row>:first-child{grid-column:1/-1}
@media (max-width:620px){.item-row{grid-template-columns:1fr 1fr}}

/* news */
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.news a{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}
.news a:hover{border-color:var(--accent-2);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.news .t{font-weight:650;font-size:14.5px;line-height:1.45;letter-spacing:-.015em}
.news .m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:auto}
.news .m .go{margin-left:auto;color:var(--accent);font-weight:600}

/* integrations */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr) 40px minmax(0,1fr);align-items:center;gap:8px}
.flow .box{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2)}
.flow .box b{display:block;margin-bottom:4px}
.flow .box.hl{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.flow .arr{text-align:center;color:var(--muted)}
@media (max-width:800px){.flow{grid-template-columns:1fr}.flow .arr{transform:rotate(90deg)}}
pre.snip{margin:0;background:var(--sunken);border-radius:12px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.6;overflow-x:auto;color:var(--ink-2)}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:550;z-index:99;box-shadow:var(--shadow-md)}

/* ---------- v3: 기록·편집 ---------- */
.ico.sm{width:14px;height:14px}
.btn .ico{width:16px;height:16px}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--crit)}
.btn.danger:hover{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:9px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--sunken);color:var(--accent)}
.icon-btn .ico{width:16px;height:16px}
.lnk{color:var(--accent);font-weight:600;text-decoration:none}
.req{font-style:normal;font-size:10.5px;font-weight:700;color:var(--crit);background:var(--crit-soft);border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px}
.warn-t{color:var(--warn)}
.chkline{display:flex!important;flex-direction:row!important;align-items:center;gap:10px;font-size:13.5px;color:var(--ink);cursor:pointer}
.chkline input{margin:0}
.mini-select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;min-width:0;box-shadow:var(--shadow-sm)}
.mini-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;box-shadow:var(--shadow-sm);color:var(--muted)}
.search-in input{border:0;outline:0;background:none;padding:8px 0;min-width:0;width:180px;color:var(--ink)}
.cell-in{width:92px;text-align:right;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
.cell-in:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.memo{white-space:pre-wrap;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 16px}
.empty .big-ico{width:44px;height:44px;padding:10px;border-radius:14px;background:var(--accent-soft);color:var(--accent);stroke-width:1.6}
.empty b{font-size:15.5px;margin-top:4px}
.empty p{margin:0 0 8px;color:var(--muted);max-width:44ch}
.upload{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px;border-style:dashed}
.doc-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.doc-meta input:first-child{flex:1;min-width:160px}
.count-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.count-grid a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;transition:border-color .15s}
.count-grid a:hover{border-color:var(--accent-2)}
.count-grid span{font-size:12.5px;color:var(--muted)}
.count-grid b{font-size:22px;font-weight:720;letter-spacing:-.02em}
.pick{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)}
.pick .chip{background:var(--surface);box-shadow:var(--shadow-sm)}
.task-list{display:flex;flex-direction:column;gap:2px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:550}
.task:hover{background:var(--surface-2)}
.task input{margin:0}
.task em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}

/* notes */
.capture{display:flex;flex-direction:column;gap:12px;padding:16px 18px}
.capture textarea{border:0;outline:0;resize:vertical;background:none;font-size:15px;line-height:1.6;color:var(--ink);min-height:52px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm);transition:border-color .15s}
.note-card:hover{border-color:var(--accent-2)}
.note-card.pinned{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 4%,var(--surface)),var(--surface))}
.note-card.done{opacity:.6}
.note-card.done .nt span{text-decoration:line-through}
.nt{display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:15px;letter-spacing:-.015em;line-height:1.4;cursor:default}
.nt input{margin-top:3px;cursor:pointer}
.nb{margin:0;white-space:pre-wrap;color:var(--ink-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.nm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500}

/* quick add */
.qa{position:relative}
.qa-btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:13px;cursor:pointer;box-shadow:0 6px 16px -8px var(--accent)}
.qa-btn:hover{filter:brightness(1.07)}
.qa-menu{position:absolute;right:0;top:calc(100% + 8px);width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-md);padding:6px;display:flex;flex-direction:column;z-index:30}
.qa-menu button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:9px;text-align:left;cursor:pointer;font-size:13.5px}
.qa-menu button:hover{background:var(--accent-soft);color:var(--accent)}
.qa-menu button .ico{color:var(--muted)}
.qa-menu button:hover .ico{color:var(--accent)}
@media (max-width:720px){.qa-btn span{display:none}.qa-btn{padding:0 11px}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(9,12,17,.34);display:flex;justify-content:flex-end}
.sheet-panel{width:min(520px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-md);display:flex;flex-direction:column;animation:sin .22s cubic-bezier(.2,.7,.2,1)}
@keyframes sin{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 24px 16px;border-bottom:1px solid var(--line-2)}
.sheet-h h3{margin:2px 0 0;font-size:20px;font-weight:720;letter-spacing:-.025em}
.sheet-b{flex:1;overflow-y:auto;padding:20px 24px}
.sheet-b .form{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:480px){.sheet-b .form{grid-template-columns:1fr}}
.sheet-f{display:flex;align-items:center;gap:8px;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-2);background:var(--surface-2)}
.sheet-f .sp{flex:1}

/* onboarding */
.onb{position:fixed;inset:0;z-index:95;background:rgba(9,12,17,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.onb-box{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow-md);padding:30px;display:flex;flex-direction:column;gap:18px;position:relative}
.onb-box::before{content:"";position:absolute;inset:0 0 auto 0;height:140px;border-radius:24px 24px 0 0;background:radial-gradient(420px 140px at 20% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);pointer-events:none}
.onb-box>*{position:relative}
.onb-box h2{margin:0;font-size:24px;font-weight:740;letter-spacing:-.03em}
.onb-box p{margin:0;color:var(--ink-2)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mode button b{font-size:14px}
.mode button span{font-size:12.5px;color:var(--muted)}
.mode button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:480px){.mode{grid-template-columns:1fr}}

/* ---------- v4: medical refresh ---------- */
.wm b{font-size:15.5px;font-weight:760;letter-spacing:-.025em;line-height:1.25}
.wm small{font-size:11.5px;letter-spacing:.01em}
.side{background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%)}
.nav-item{position:relative}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.mod-head .mh{display:flex;align-items:center;gap:18px}
.mod-head .mi{width:54px;height:54px;flex:none;border-radius:17px;display:grid;place-items:center;color:var(--accent);background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--mint) 14%,var(--surface)));border:1px solid color-mix(in srgb,var(--accent) 16%,transparent)}
.mod-head .mi .ico{width:25px;height:25px;stroke-width:1.8}
@media (max-width:620px){.mod-head .mi{display:none}.mod-head h1{font-size:25px}}
.brief>svg.brief-ecg{position:absolute;left:0;right:0;bottom:2px;width:100%;height:34px;pointer-events:none}
.brief-ecg path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.18;vector-effect:non-scaling-stroke}
.tbtn{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm);border-radius:10px}
table.data td{font-size:14px}
.note{font-size:13px}
.kpi .l{color:var(--ink-2)}
.card{border-color:var(--line-2)}
h2.ct{font-size:16px}

.meter.seg{gap:2px;background:none}
.meter.seg span{border-radius:999px}
.mini-leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.mini-leg i{width:7px!important;height:7px!important;margin-right:5px!important}
.brief{padding-bottom:40px}

@media (max-width:620px){.kpis:has(> :nth-child(3):last-child)>:nth-child(3){grid-column:1/-1}}
.sheet:not([hidden]) ~ .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
/* ---------- v6: 의료기기 스타일 · 시장 분석 · 마스코트 ---------- */
.vmon{border-radius:22px;padding:16px 18px 18px;background:radial-gradient(800px 260px at 10% 0%,#0E2A33 0%,transparent 60%),linear-gradient(180deg,#071318,#0A1820);border:1px solid #17323B;box-shadow:0 18px 40px -18px rgba(5,20,30,.6),inset 0 1px 0 rgba(255,255,255,.04);color:#CFE7EA}
.vm-top{display:flex;align-items:center;gap:14px;font-size:11.5px;letter-spacing:.12em;color:#7FA9AE;margin-bottom:12px;flex-wrap:wrap}
.vm-brand b{color:#E6F6F5;letter-spacing:.08em;margin-right:6px}
.vm-live{display:inline-flex;align-items:center;gap:6px;color:#3BE38B;font-weight:700}
.vm-live i{width:7px;height:7px;border-radius:50%;background:#3BE38B;box-shadow:0 0 0 3px rgba(59,227,139,.18);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.vm-time{margin-left:auto;color:#9CC5C9;letter-spacing:.06em}
.vm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.vm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.vm-grid{grid-template-columns:1fr}}
.vm-ch{border-radius:14px;padding:10px 12px 6px;background:rgba(255,255,255,.025);border:1px solid rgba(127,169,174,.16);min-width:0}
.vm-ch.alarm{border-color:color-mix(in srgb,var(--vc) 60%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--vc) 30%,transparent)}
.vm-h{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;color:var(--vc);font-weight:700}
.vm-h em{font-style:normal;color:#0A1820;background:var(--vc);border-radius:4px;padding:0 5px;animation:blink 1.2s infinite}
.vm-v{font-size:26px;font-weight:600;color:var(--vc);line-height:1.15;margin-top:4px;text-shadow:0 0 14px color-mix(in srgb,var(--vc) 45%,transparent)}
.vm-s{font-size:11.5px;color:#7FA9AE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vm-ch canvas{display:block;width:100%;height:64px;margin-top:4px}

/* 품목군 선택 */
.catbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:border-color .15s,background .15s,transform .15s}
.catbtn .ico{width:26px;height:26px;color:var(--accent);stroke-width:1.6}
.catbtn:hover{border-color:var(--accent-2);transform:translateY(-1px)}
.catbtn[aria-pressed="true"]{background:linear-gradient(160deg,var(--accent-soft),color-mix(in srgb,var(--mint) 12%,var(--surface)));border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.subcard{border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:var(--surface-2);min-width:0}
.sc-h{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sc-h b{font-size:15px}
.sc-badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.sc-badge.alt{background:color-mix(in srgb,var(--c4) 16%,transparent);color:var(--c4)}
.sc-badge .ico{width:20px;height:20px}
ol.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ol.rank li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 6px;border-radius:12px}
ol.rank li:first-child{background:var(--surface)}
.rk{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--sunken);color:var(--ink-2)}
ol.rank li:first-child .rk{background:var(--accent);color:var(--accent-ink)}
.rk-t{font-weight:650}
.rk-tags{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.rk-tags b{color:var(--ink-2)}
.pill-diff{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:650;background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint);vertical-align:1px}
.rk-v{font-size:20px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rk-v small{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:2px}
.linkchip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--sunken)!important}
.cnt-s{font-size:11px;color:var(--muted);font-weight:700;margin-left:2px}
.chips .chip[aria-pressed="true"] .cnt-s{color:var(--accent)}
.cgroups{display:flex;flex-direction:column;gap:10px}
.cgroup{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.cg-l{font-size:12.5px;font-weight:700;color:var(--muted)}
.cgroup .chip{background:var(--sunken)}
.cgroup .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:620px){.cgroup{grid-template-columns:1fr}}
.search-big{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:4px 16px;background:var(--surface);box-shadow:var(--shadow-sm)}
.search-big:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search-big .ico{color:var(--accent);width:22px;height:22px}
.search-big input{flex:1;border:0;outline:0;background:none;font-size:17px;padding:12px 0;min-width:0}
.legend i.st-0,.legend i.st-1,.legend i.st-2,.legend i.st-3,.legend i.st-4,.legend i.st-5{width:12px;height:12px}

/* 마스코트 길 */
.lane{position:relative;height:74px;margin:6px clamp(16px,3vw,36px) 0;border-bottom:2px dashed color-mix(in srgb,var(--accent) 22%,var(--line));--lane:600px}
.lane::before{content:"";position:absolute;left:0;right:0;bottom:-2px;height:22px;background:linear-gradient(0deg,color-mix(in srgb,var(--mint) 8%,transparent),transparent);pointer-events:none}
.mascot{position:absolute;left:0;bottom:-3px;width:66px;height:72px;border:0;background:none;padding:0;cursor:pointer;animation:stroll 38s linear infinite;z-index:2}
.m-flip{display:block;width:100%;height:100%;animation:face 38s linear infinite}
.m-flip svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes stroll{0%{transform:translateX(0)}50%{transform:translateX(var(--lane))}100%{transform:translateX(0)}}
@keyframes face{0%,49.99%{transform:scaleX(1)}50%,100%{transform:scaleX(-1)}}
.m-body{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5px)}}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:stepA .42s ease-in-out infinite alternate}
.leg.r{animation-name:stepB}
@keyframes stepA{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes stepB{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.arm{transform-box:fill-box;transform-origin:50% 50%;animation:swing .42s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.mascot:hover,.mascot:hover *,.mascot.talk,.mascot.talk *{animation-play-state:paused}
.mascot:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
.m-bubble{position:absolute;bottom:16px;max-width:min(340px,80vw);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-md);border-radius:14px;padding:9px 13px;font-size:13px;color:var(--ink);z-index:5;line-height:1.5}
.m-bubble::after{content:"";position:absolute;left:-6px;bottom:14px;width:10px;height:10px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.m-bubble.flip::after{left:auto;right:-6px;border-left:0;border-bottom:0;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.lane-hi{position:absolute;right:0;bottom:8px;font-size:11.5px;color:var(--muted);pointer-events:none}
@media (max-width:620px){.lane-hi{display:none}}

.pico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.pico .ico{width:19px;height:19px}
/* ---------- v7: 홈 배너 ---------- */
.hero{position:relative;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-md);isolation:isolate}
.hero-track{display:flex;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.hero-slide{flex:0 0 100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:12px;min-height:300px;padding:36px 44px 56px}
.hero-slide.t-dark{background:radial-gradient(520px 300px at 85% 40%,rgba(22,179,174,.28),transparent 70%),linear-gradient(120deg,#0A1B33 0%,#0D2D5C 55%,#0B3F78 100%);color:#fff}
.hero-slide.t-sky{background:radial-gradient(520px 260px at 80% 50%,rgba(12,99,191,.14),transparent 70%),linear-gradient(120deg,#EEF5FD,#DDEBFA);color:#0B1B2C}
.hero-slide.t-mint{background:radial-gradient(520px 260px at 80% 50%,rgba(14,156,151,.16),transparent 70%),linear-gradient(120deg,#ECF8F6,#DBF0EE);color:#0B1B2C}
.hero-eye{font-size:13px;font-weight:700;letter-spacing:.02em;opacity:.85;margin-bottom:10px}
.t-dark .hero-eye{color:#7FD3D0}.t-sky .hero-eye{color:#0C63BF}.t-mint .hero-eye{color:#0E8580}
.hero-txt h2{margin:0;font-size:clamp(25px,2.6vw,34px);line-height:1.3;font-weight:780;letter-spacing:-.035em;text-wrap:balance}
.hero-txt .hl{color:#0C63BF}
.hero-txt p{margin:14px 0 0;font-size:15px;line-height:1.65;opacity:.86;max-width:46ch}
.hero-cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hbtn{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:12px;font-weight:650;font-size:14px;text-decoration:none;transition:transform .15s,filter .15s}
.hbtn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.hbtn.pri{background:#2F86F0;color:#fff;box-shadow:0 8px 18px -8px rgba(47,134,240,.8)}
.t-sky .hbtn.pri{background:#0C63BF}.t-mint .hbtn.pri{background:#0E8E89;box-shadow:0 8px 18px -8px rgba(14,142,137,.7)}
.hbtn.ghost{background:rgba(255,255,255,.12);color:inherit;border:1px solid rgba(255,255,255,.28)}
.t-sky .hbtn.ghost,.t-mint .hbtn.ghost{background:rgba(255,255,255,.7);border-color:rgba(11,27,44,.12)}
.hero-vis{display:flex;justify-content:center;align-items:center}
.hero-art{width:100%;max-width:440px;height:auto;display:block}
.hero-art .pin{animation:pinb 2.4s ease-in-out infinite}
@keyframes pinb{50%{transform:translateY(-4px)}}
.hero-ctl{position:absolute;right:20px;bottom:16px;display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:rgba(11,27,44,.55);backdrop-filter:blur(8px);color:#fff;z-index:2}
.hc-btn{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:#fff;cursor:pointer;font-size:15px;line-height:1}
.hc-btn:hover{background:rgba(255,255,255,.18)}
.hc-num{font-size:12px;padding:0 6px;opacity:.9}
.hc-num b{font-weight:700}
.hero-dots{position:absolute;left:44px;bottom:22px;display:flex;gap:6px;z-index:2}
.hero-dots button{width:8px;height:8px;border-radius:999px;border:0;padding:0;background:rgba(127,150,180,.5);cursor:pointer;transition:width .25s,background .25s}
.hero-dots button[aria-current]{width:26px;background:#2F86F0}
@media (max-width:860px){.hero-slide{grid-template-columns:1fr;padding:28px 24px 64px}.hero-vis{order:-1}.hero-art{max-width:300px}.hero-dots{left:24px}}
@media (max-width:480px){.hero-vis{display:none}}

/* ---------- v8: 미국 시장 ---------- */
.us-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;border-radius:24px;padding:30px 34px;color:#fff;background:radial-gradient(500px 260px at 90% 20%,rgba(47,134,240,.35),transparent 70%),radial-gradient(420px 220px at 0% 100%,rgba(214,57,64,.22),transparent 70%),linear-gradient(120deg,#0A1B33,#13306A);box-shadow:var(--shadow-md)}
.us-hero h2{margin:6px 0 10px;font-size:clamp(22px,2.3vw,30px);line-height:1.32;font-weight:780;letter-spacing:-.03em;text-wrap:balance}
.us-hero h2 span{color:#7FC1FF}
.us-hero p{margin:0;opacity:.88;font-size:14.5px;line-height:1.65;max-width:56ch}
.us-hero .hero-eye{color:#9CC8FF}
.us-src{margin-top:12px;color:rgba(255,255,255,.7)!important}
.us-src .lnk{color:#9CC8FF}
.us-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.us-stats div{border-radius:16px;padding:14px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:2px}
.us-stats b{white-space:nowrap;font-size:22px;font-weight:780;letter-spacing:-.02em}
.us-stats span{font-size:12px;opacity:.75}
@media (max-width:900px){.us-hero{grid-template-columns:1fr;padding:24px}}
.us-tl li{grid-template-columns:20px minmax(0,1fr) 0}
.us-tl .n{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.steps li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
ol.steps li:last-child{border-bottom:0}
.sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:var(--accent-soft);color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- v12: 박람회 ---------- */
.xcal-wrap{overflow-x:auto;margin-top:6px}
.xcal{min-width:760px;display:flex;flex-direction:column}
.xr{display:grid;grid-template-columns:230px repeat(12,minmax(0,1fr));align-items:center;border-bottom:1px solid var(--line-2);min-height:46px}
.xr.xh{min-height:34px;font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);border-radius:10px 10px 0 0}
.xn{padding:6px 10px;font-size:13px;line-height:1.35;min-width:0;position:sticky;left:0;z-index:1;background:var(--surface);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.xr.xh .xn{background:var(--surface-2)}
.xn b{font-weight:650}
.xm{text-align:center}.xm.cur{color:var(--accent)}
.xc{position:relative;height:100%;min-height:46px;display:flex;align-items:center;justify-content:center;border-left:1px dashed var(--line-2)}
.xc.cur{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.xb{display:block;width:calc(100% - 6px);height:12px;border-radius:6px;background:var(--accent);opacity:.85}
.xb.ivd{background:var(--c2)}.xb.den{background:var(--c4)}.xb.mfg{background:var(--c7)}.xb.unk{background:repeating-linear-gradient(45deg,var(--c7),var(--c7) 4px,transparent 4px,transparent 8px)}
.xd{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--surface);top:50%;left:50%;transform:translate(-50%,-50%)}
.xnone{grid-column:2/-1;font-size:12.5px;color:var(--muted);padding:6px 10px}
.xcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.xcard.live{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));box-shadow:inset 3px 0 0 var(--ok)}
.xmeta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.xmeta span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:620px){.xr{grid-template-columns:150px repeat(12,minmax(0,1fr))}.xcal{min-width:620px}}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lgSide" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#16B3AE"/><stop offset="1" stop-color="#0B57B8"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lgSide)"/><path d="M18 48 L32 14 L46 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22.6 37 H26.4 L29 30.5 L32.6 42.5 L35.2 37 H41.4" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="wm"><b>Aurelis Medical</b><small>Global Trade Console</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="메뉴"></nav>
    <div class="side-card"><b>내 기록은 자동 저장됩니다</b>상단 "새 기록"으로 어디서든 바로 입력하세요. 백업·초기화는 내 정보에서 합니다.<a href="#profile">내 정보 · 데이터 관리 →</a></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="top">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-r">
        <button class="kbtn" id="kbtn"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>기능 검색</span><kbd>Ctrl K</kbd></button>
        <div class="qa"><button class="qa-btn" id="qaBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>새 기록</span></button><div class="qa-menu" id="qaMenu" hidden></div></div><span class="status hide-sm" id="saveStatus"><i></i><span>이 브라우저에 저장</span></span>
        <button class="icon-btn tbtn" id="themeBtn" aria-label="밝은 화면/어두운 화면 전환" title="밝은 화면 / 어두운 화면"></button>
        <span class="avatar" aria-hidden="true">AM</span>

    <main class="content" id="view"></main>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-panel" role="dialog" aria-labelledby="shT"><div class="sheet-h"><div><div class="eyebrow" id="shEy"></div><h3 id="shT"></h3></div><button class="icon-btn" data-close-sheet aria-label="닫기"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<form class="sheet-b" id="shF" novalidate></form>
<div class="sheet-f"><button class="btn danger" id="shDel" type="button">삭제</button><span class="sp"></span><button class="btn" type="button" data-close-sheet>취소</button><button class="btn pri" id="shSave" type="button">저장</button></div></div></div>
<div class="onb" id="onb" hidden><div class="onb-box" role="dialog" aria-labelledby="onbT">
<div class="brand-mark" style="width:52px;height:52px"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lgOnb" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#16B3AE"/><stop offset="1" stop-color="#0B57B8"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lgOnb)"/><path d="M18 48 L32 14 L46 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22.6 37 H26.4 L29 30.5 L32.6 42.5 L35.2 37 H41.4" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="stack" style="gap:8px"><h2 id="onbT">수출입 업무 기록을 시작해 볼까요?</h2><p>선적, 인허가, 인보이스, 재고, 업무 메모를 한곳에 기록하고 만료일과 지연을 자동으로 챙겨 줍니다.</p></div>
<div class="form" style="grid-template-columns:1fr 1fr"><div class="field"><label for="onbName">이름</label><input id="onbName" placeholder="예: 김민지"></div><div class="field"><label for="onbCo">회사명</label><input id="onbCo"></div></div>
<div class="stack" style="gap:8px"><span class="eyebrow">어떻게 시작할까요?</span><div class="mode" id="onbMode"><button data-mode="sample" aria-pressed="true"><b>예시 데이터로 둘러보기</b><span>가상의 거래 기록이 채워진 상태로 시작합니다. 나중에 지울 수 있습니다.</span></button><button data-mode="empty" aria-pressed="false"><b>빈 상태로 시작</b><span>내 제품부터 직접 등록합니다.</span></button></div></div>
<p class="note" id="onbWhere"></p>
<button class="btn pri" id="onbGo" style="padding:12px 16px;font-size:14px">시작하기</button></div></div>
<div class="cmdk" id="cmdk" hidden><div class="cmdk-box" role="dialog" aria-label="기능 검색"><div class="cmdk-in"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="cmdq" placeholder="기능 이름을 입력하세요 (예: 환율, 리콜, HS)" autocomplete="off"><kbd>Esc</kbd></div><div class="cmdk-list" id="cmdl"></div></div></div>
<script>
// ── 서버 API 주소 설정 ──────────────────────────────

/* ============ charts ============ */
let charts=[],gid=0;
function mount(el,draw){if(!el)return;const c={el,draw};charts.push(c);draw(el)}
let rsT;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>charts.forEach(c=>c.el.isConnected&&c.draw(c.el)),120)});
function niceNum(x){const e=Math.floor(Math.log10(x)),f=x/10**e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*10**e}
function niceTicks(lo,hi,n=4){if(hi===lo){hi+=1;lo-=1}const st=niceNum((hi-lo)/n);const a=Math.floor(lo/st+1e-9)*st,b=Math.ceil(hi/st-1e-9)*st;const t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(6));return t}
function smooth(pts){ // monotone cubic
  const n=pts.length;if(n<3)return pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const dx=[],dy=[],m=[],t=[];for(let i=0;i<n-1;i++){dx[i]=pts[i+1][0]-pts[i][0];dy[i]=pts[i+1][1]-pts[i][1];m[i]=dy[i]/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=t[i+1]=0;continue}const a=t[i]/m[i],b=t[i+1]/m[i],h=a*a+b*b;if(h>9){const s=3/Math.sqrt(h);t[i]=s*a*m[i];t[i+1]=s*b*m[i]}}
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${(pts[i][0]+h).toFixed(1)},${(pts[i][1]+t[i]*h).toFixed(1)} ${(pts[i+1][0]-h).toFixed(1)},${(pts[i+1][1]-t[i+1]*h).toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`}
  return d}
function lineChart(el,o){
  const W=Math.max(el.clientWidth,260),H=o.h||240,p={l:o.pl||48,r:16,t:14,b:30};
  const all=o.series.flatMap(s=>s.values).concat(o.band||[]).concat(o.marks?o.marks.map(m=>m.v):[]);
  let lo=o.yMin??Math.min(...all),hi=o.yMax??Math.max(...all);
  const pad=(hi-lo)*.08||1;if(o.yMin==null)lo-=pad;if(o.yMax==null)hi+=pad;
  const tk=niceTicks(lo,hi,4);lo=tk[0];hi=tk[tk.length-1];
  const n=o.labels.length,iw=W-p.l-p.r,ih=H-p.t-p.b;
  const X=i=>p.l+iw*i/(n-1),Y=v=>p.t+ih*(1-(v-lo)/(hi-lo));
  const f=o.yFmt||(v=>nf(v,Math.abs(hi-lo)<10?1:0));
  let s=`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>`;
  const ids=o.series.map(se=>{const id='g'+(++gid);s+=`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(${se.c});stop-opacity:.24"/><stop offset="1" style="stop-color:var(${se.c});stop-opacity:0"/></linearGradient>`;return id});
  s+='</defs>';
  if(o.band)s+=`<rect x="${p.l}" y="${Y(o.band[1])}" width="${iw}" height="${Y(o.band[0])-Y(o.band[1])}" rx="6" style="fill:var(--mint-soft)"/>`;
  tk.forEach(v=>{s+=`<line class="grid" x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${p.l-10}" y="${Y(v)+4}" text-anchor="end">${f(v)}</text>`});
  (o.marks||[]).forEach(m=>{s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(m.v)}" y2="${Y(m.v)}" style="stroke:var(${m.c||'--crit'});stroke-dasharray:2 4;stroke-width:1.2"/><text x="${W-p.r}" y="${Y(m.v)-6}" text-anchor="end" style="fill:var(${m.c||'--crit'});font-weight:600">${m.t}</text>`});
  { // x축 라벨: 겹치지 않게 간격을 두고 배치 (마지막 라벨은 항상 표시)
    const tw=l=>String(l).length*6.6+10,lastL=X(n-1)-tw(o.labels[n-1]);let right=-1e9;
    s+=`<text x="${X(n-1)}" y="${H-8}" text-anchor="end">${o.labels[n-1]}</text>`;
    const step=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(iw/90))));
    for(let i=0;i<n-1;i+=step){const w=tw(o.labels[i]),a=i===0?'start':'middle',x0=i===0?X(i):X(i)-w/2;if(x0<right||x0+w>lastL)continue;s+=`<text x="${X(i)}" y="${H-8}" text-anchor="${a}">${o.labels[i]}</text>`;right=x0+w}
  }
  o.series.forEach((se,k)=>{
    const pts=se.values.map((v,i)=>[X(i),Y(v)]),d=o.straight?pts.map((q,i)=>`${i?'L':'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(''):smooth(pts);
    if(se.area)s+=`<path d="${d}L${X(n-1)},${p.t+ih}L${X(0)},${p.t+ih}Z" style="fill:url(#${ids[k]})"/>`;
    s+=`<path d="${d}" style="fill:none;stroke:var(${se.c});stroke-width:${se.w||2.2};${se.dash?'stroke-dasharray:4 5;':''}stroke-linejoin:round;stroke-linecap:round"/>`;
    if(se.flag)se.values.forEach((v,i)=>{if(se.flag(v))s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" style="fill:var(--crit);stroke:var(--surface);stroke-width:1.5"/>`});
    if(!se.dash)s+=`<circle cx="${X(n-1)}" cy="${Y(se.values[n-1])}" r="7" style="fill:var(${se.c});opacity:.18"/><circle cx="${X(n-1)}" cy="${Y(se.values[n-1])}" r="3.5" style="fill:var(${se.c});stroke:var(--surface);stroke-width:2"/>`;
  });
  (o.points||[]).forEach(pt=>{s+=`<circle cx="${X(pt.i)}" cy="${Y(pt.v)}" r="6" style="fill:var(${pt.c});stroke:var(--surface);stroke-width:2.5"/>`});
  s+=`<line class="hx" x1="0" x2="0" y1="${p.t}" y2="${p.t+ih}" style="stroke:var(--muted);stroke-width:1;opacity:0"/><circle class="hd" r="4.5" cx="-10" cy="-10" style="fill:var(--surface);stroke:var(${o.series[0].c});stroke-width:2.5;opacity:0"/></svg><div class="tip" hidden></div>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'),hx=svg.querySelector('.hx'),hd=svg.querySelector('.hd'),tip=el.querySelector('.tip');
  svg.onpointermove=e=>{const r=svg.getBoundingClientRect();const i=clamp(Math.round((e.clientX-r.left-p.l)/iw*(n-1)),0,n-1);
    hx.setAttribute('x1',X(i));hx.setAttribute('x2',X(i));hx.style.opacity=.5;hd.setAttribute('cx',X(i));hd.setAttribute('cy',Y(o.series[0].values[i]));hd.style.opacity=1;tip.hidden=false;
    tip.innerHTML=`<b>${o.tipLabel?o.tipLabel(i):o.labels[i]}</b><br>`+o.series.filter(se=>!se.noTip).map(se=>`<span style="color:var(${se.c})">●</span> ${se.name} <b>${(o.tipFmt||f)(se.values[i])}</b>`).join('<br>');
    tip.style.left=clamp(X(i),90,W-90)+'px';tip.style.top=(p.t-2)+'px'};
  svg.onpointerleave=()=>{hx.style.opacity=0;hd.style.opacity=0;tip.hidden=true};
}
function barChart(el,o){
  const W=Math.max(el.clientWidth,260),H=o.h||240,p={l:o.pl||48,r:8,t:14,b:30};
  const S=o.series,n=o.labels.length;const mx=Math.max(...S.flatMap(s=>s.values));
  const tk=niceTicks(0,mx,4),hi=tk[tk.length-1],iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/n,gw=Math.min(bw*.62,34*S.length),sw=gw/S.length;
  const Y=v=>p.t+ih*(1-v/hi),f=o.yFmt||(v=>nf(v));
  let s=`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  tk.forEach(v=>{s+=`<line class="grid" x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${p.l-10}" y="${Y(v)+4}" text-anchor="end">${f(v)}</text>`});
  const step=Math.max(1,Math.ceil(n/Math.floor(iw/48)));
  o.labels.forEach((l,i)=>{const x0=p.l+i*bw+(bw-gw)/2;
    S.forEach((se,j)=>{const v=se.values[i],c=se.cFn?se.cFn(v,i):se.c,x=x0+j*sw+1.5,w=Math.max(sw-3,2),y=Y(v),h=Math.max(p.t+ih-y,0),r=Math.min(5,w/2,h);
      const last=i===n-1;s+=`<path d="M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z" style="fill:var(${c});opacity:${last||!o.fadeOld?1:.55}"><title>${l} ${se.name||''}: ${(o.tipFmt||f)(v)}</title></path>`});
    if(i%step===0)s+=`<text x="${p.l+i*bw+bw/2}" y="${H-8}" text-anchor="middle" style="${i===n-1?'fill:var(--ink);font-weight:600':''}">${l}</text>`});
  el.innerHTML=s+'</svg>';
}
function hbars(rows,o={}){
  const mx=o.max||Math.max(...rows.map(r=>r.value));

}
function donut(parts,size=170,center=''){
  const sw=Math.max(12,size*.1),r=size/2-sw/2-2,C=2*Math.PI*r,tot=parts.reduce((a,b)=>a+b.value,0),gap=parts.length>1?3:0;let off=0;
  let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none;max-width:100%"><circle cx="${size/2}" cy="${size/2}" r="${r}" style="fill:none;stroke:var(--sunken);stroke-width:${sw}"/><g transform="rotate(-90 ${size/2} ${size/2})">`;
  parts.forEach(pt=>{const len=pt.value/tot*C,l=Math.max(len-gap,0.01);s+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" style="fill:none;stroke:var(${pt.c});stroke-width:${sw};stroke-dasharray:${l} ${C-l};stroke-dashoffset:${-off}"><title>${pt.label}</title></circle>`;off+=len});
  return s+`</g>${center}</svg>`;
}

  root.innerHTML=head('개요','글로벌 시장 동향',CUR.desc)+`

  <section class="card"><div class="card-h"><div><h2 class="ct">대륙별 품목 수요 지수</h2><div class="sub">진할수록 수요가 큽니다 · 선택한 품목군 열이 강조됩니다 (예시 지표)</div></div><div class="chips" id="hcont">${CONT_ORDER.map(c=>`<button class="chip" aria-pressed="${c===hcont}">${c}</button>`).join('')}</div></div><div id="mheat"></div></section>`;
  const cls={규제:'crit',인허가:'warn',시장:'ok',수출지원:'info'};
  const flag=c=>`<span class="code">${c}</span>`;
  function analysis(){
    $$('#mcats .catbtn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===cat));

    $('#mrec').innerHTML=`<div class="sc-h"><span class="sc-badge">${ic('c_target')}</span><div><b>추천 진출 국가 TOP 5</b><div class="note">${cat} · 수요가 크고 현지 공급이 적은 순</div></div></div>
     <ol class="rank">${rows.map((r,i)=>`<li><span class="rk">${i+1}</span><div class="rk-main"><div class="rk-t">${flag(r.c)} ${COUNTRY[r.c]} <span class="note">${CONT[r.c]}</span></div>
      <div class="meter" style="margin:6px 0"><span style="width:${r.score}%;background:linear-gradient(90deg,var(--mint),var(--accent))"></span></div>
      <div class="rk-tags"><span>수요 <b>${r.demand}</b></span><span>공급 여유 <b>${r.room}</b></span><span>인허가 <b>${r.reg}</b></span><span>FTA <b>${r.fta}</b></span>${r.risk?`<span class="down">제재·결제 위험</span>`:''}</div></div><span class="rk-v">${r.score}<small>점</small></span></li>`).join('')}</ol>

    const ps=PRODUCTS.filter(p=>catOf(p)===cat);
    $('#mprods').innerHTML=`<span class="note">이 품목군의 내 제품:</span>`+(ps.length?ps.map(p=>`<a class="chip linkchip" href="#hs" data-hsq="${esc(p.short)}">${esc(p.short)} <span class="mono">${esc(p.hs||'')}</span></a>`).join(''):`<a class="lnk" href="#products">제품 등록하기</a>`);
  }
  function real(){
    const st=KR_STATS.byCat[cat]||{},useCat=st.rows;
    let body='';
    if(rk==='kr'){const s=useCat?st:KR_STATS.overall;const mx=Math.max(...s.rows.map(r=>r[1]||0),1);
      body=`<div class="note" style="margin-bottom:8px">${useCat?`<b>${st.title}</b>`:(st.nocat?`${st.nocat} <b>${KR_STATS.overall.title}</b>`:`${cat} 품목군의 국가별 순위는 공개 통계에서 확인되지 않아 <b>${KR_STATS.overall.title}</b>를 보여 줍니다.`)}</div>
      <ol class="rank">${s.rows.map((r,i)=>`<li><span class="rk">${i+1}</span><div class="rk-main"><div class="rk-t">${flag(r[0])} ${COUNTRY[r[0]]||KR_EXTRA_C[r[0]]||r[0]}${useCat&&!KR_STATS.overall.rows.some(o=>o[0]===r[0])?' <span class="pill-diff">전체 TOP5 밖</span>':''}</div>${r[1]!=null?`<div class="meter" style="margin:6px 0"><span style="width:${r[1]/mx*100}%;background:var(--c1)"></span></div>`:''}${r[2]?`<div class="note">${r[2]}</div>`:''}</div>${r[1]!=null?`<span class="rk-v">${r[1].toFixed(1)}<small>${s.unit||''}</small></span>`:''}</li>`).join('')}</ol>${useCat?`<p class="note" style="margin:8px 0 0">참고 · 의료기기 전체 TOP5 (2025): ${KR_STATS.overall.rows.map(o=>COUNTRY[o[0]]).join(' · ')}</p>`:''}
      ${st.item?`<div class="callout" style="margin-top:10px"><b>${cat} 품목 실적</b>${st.item}</div>`:''}${useCat&&st.note?`<p class="note" style="margin:10px 0 0">${st.note}</p>`:(!useCat?`<p class="note" style="margin:10px 0 0">${KR_STATS.overall.more}</p>`:'')}
      <p class="note" style="margin:6px 0 0">출처: ${(useCat?st.src:KR_STATS.overall.src).map(([n,u])=>`<a class="lnk" href="${u}" target="_blank" rel="noopener">${n}</a>`).join(' · ')}</p>`}
    else{const ids=new Set(PRODUCTS.filter(p=>catOf(p)===cat).map(p=>p.id)),agg={};
      SHIPMENTS.filter(s=>ids.has(s.p)).forEach(s=>{const c=PORT_C[s.to]||'?';agg[c]=(agg[c]||0)+1});
      let rows=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,5),unit='건 (선적)',basis=`${cat} 제품의 선적 기록 기준`;
      if(!rows.length){const inv={};INVOICES.forEach(i=>{inv[i.c]=(inv[i.c]||0)+(i.amt||0)});rows=Object.entries(inv).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([c,v])=>[c,+(v/1e6).toFixed(2)]);unit='백만 달러';basis=`${cat} 선적 기록이 없어 전체 인보이스 금액 기준`}
      const mx=Math.max(...rows.map(r=>r[1]),1);
      body=`<div class="note" style="margin-bottom:8px">${basis}</div>`+(rows.length?`<ol class="rank">${rows.map((r,i)=>`<li><span class="rk">${i+1}</span><div class="rk-main"><div class="rk-t">${flag(r[0])} ${COUNTRY[r[0]]||r[0]}</div><div class="meter" style="margin:6px 0"><span style="width:${r[1]/mx*100}%;background:var(--c2)"></span></div></div><span class="rk-v">${r[1]}<small>${unit}</small></span></li>`).join('')}</ol>`:emptyState('fx','기록이 없습니다','선적이나 인보이스를 추가하면 우리 회사 순위가 계산됩니다.','shipments'))}

    ${cs.map(c=>`<tr><td style="white-space:nowrap">${flag(c)} ${COUNTRY[c]}</td>${CATS.map(k=>{const v=mkScore(k,c).demand;return `<td class="h" style="background:color-mix(in srgb,var(--heat-1) ${Math.round(Math.max(0,v-25)/75*80)}%,var(--heat-0));color:${v>70?'#fff':'var(--ink)'};${k===cat?'box-shadow:inset 0 0 0 2px var(--accent)':''}">${v}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
  let data=NEWS_SNAPSHOT,live=false,limit=12;
  const norm=d=>({...d,items:d.items.map(n=>({...n,cc:n.cc||REGION_CC[n.region]||'GL'}))});
  function news(){
    const items=data.items.filter(n=>tag==='전체'||n.tag===tag);
    const conts=['전체',...CONT_ORDER,'국내·글로벌'];
    $('#ncont').innerHTML=conts.map(c=>{const n=items.filter(x=>c==='전체'||newsCont(x.cc)===c).length;return `<button class="chip" data-c="${c}" aria-pressed="${c===cont}">${c} <span class="cnt-s">${n}</span></button>`}).join('');
    const inCont=items.filter(x=>cont==='전체'||newsCont(x.cc)===cont);
    const ccs=[...new Set(inCont.map(x=>x.cc))];
    $('#ncc').innerHTML=cont==='전체'?'':['전체',...ccs].map(c=>`<button class="chip" data-cc="${c}" aria-pressed="${c===ncc}">${c==='전체'?'모든 국가':(COUNTRY[c]||c)}</button>`).join('');
    const all=inCont.filter(x=>ncc==='전체'||x.cc===ncc).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),list=all.slice(0,limit);
    $('#newsMeta').innerHTML=(live?`<span class="up">● 실시간</span> · ${esc(data.collected)} 갱신`:`수집 시각 ${esc(data.collected)} · 실시간 연동 전 스냅샷`)+` · 기사 ${all.length}건 · 카드를 누르면 원문이 열립니다`;
    $('#news').innerHTML=list.map(n=>`<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer"><div class="hstack">${pill(cls[n.tag]||'plain',n.tag)}<span class="note">${n.cc==='GL'?'글로벌':n.cc==='KR'?'국내':`${COUNTRY[n.cc]||n.cc} · ${newsCont(n.cc)}`}</span></div><div class="t">${esc(n.title)}</div><div class="m"><span>${esc(n.source)}</span>${n.date?`<span>· ${esc(n.date)}</span>`:''}<span class="go">원문 ${ic('ext','ico" style="width:13px;height:13px;vertical-align:-2px')}</span></div></a>`).join('')||`<p class="note">조건에 맞는 기사가 없습니다.</p>`;
    $('#nmore').innerHTML=all.length>limit?`<button class="btn" id="nmoreBtn">기사 ${all.length-limit}건 더 보기</button>`:'';const mb=$('#nmoreBtn');if(mb)mb.onclick=()=>{limit+=12;news()};
  }
  $('#mcats').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;store.set('aur-mcat',cat);analysis();heat()};

  $('#ncont').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cont=b.dataset.c;ncc='전체';limit=12;store.set('aur-ncont',cont);news()};

  analysis();heat();news();
  loadLive('news').then(d=>{if(d&&d.items&&root.isConnected){data=norm(d);live=true;news()}});
});

    else if(hi>p.kill){v=['crit','폐기'];why.push(`최고 ${hi}°C가 즉시 폐기 기준(${p.kill}°C)을 넘었습니다.`)}
    else if(hi>p.shortHi){v=d<=2?['warn','QA 검토 (격리 보관)']:['crit','폐기'];why.push(`최고 ${hi}°C가 단기 허용 상한(${p.shortHi}°C)을 넘었습니다. ${d<=2?'2시간 이내 노출이므로 QA가 안정성 자료를 추가 검토합니다.':'2시간을 넘는 노출이므로 폐기 대상입니다.'}`)}
    else if(hi>p.hi||lo<p.lo){ if(lo<p.lo){kind='저온';bud=p.lowBud}
      used=prev+d;const r=used/bud;
      if(r>1){v=['crit','폐기'];why.push(`누적 ${kind} 노출 ${used}h가 허용 예산 ${bud}h를 넘었습니다.`)}
      else if(r>.8){v=['warn','사용 가능 · 예산 경고'];why.push(`누적 ${used}h로 예산의 ${Math.round(r*100)}%를 사용했습니다. 해당 로트는 우선 출하(FEFO)하고 추가 이탈이 없도록 관리하세요.`)}
      else {v=['ok','사용 가능 (이탈 기록 필요)'];why.push(`단기 허용 범위 안의 노출이며 누적 ${used}h로 예산의 ${Math.round(r*100)}%를 사용했습니다. 이탈 보고서(Deviation Report)에 기록하고 출하하세요.`)}}
    else {v=['ok','정상'];why.push('입력한 온도가 보관 범위 안에 있습니다.')}
    const r=used?Math.min(used/bud,1):0;
    $('#dres').innerHTML=`<div class="eyebrow">판정 결과</div><div class="big" style="color:var(--${v[0]})">${v[1]}</div>
    <div class="callout ${v[0]}">${why.join(' ')}</div>
    ${used?`<div><div class="card-h" style="margin-bottom:6px"><h2 class="ct">${kind} 노출 안정성 예산</h2><span class="sub num">${used}h / ${bud}h</span></div>
      <div class="meter" style="height:12px"><span style="width:${Math.min(prev/bud,1)*100}%;background:var(--c7)"></span><span style="width:${Math.max(0,r-Math.min(prev/bud,1))*100}%;background:var(--${v[0]})"></span></div>
      <div class="legend" style="margin-top:8px">${legend([['기존 누적','--c7'],['이번 이탈','--'+v[0]]]).replace(/<\/?div[^>]*>/g,'')}</div></div>`:''}
    <div class="divider"></div><h2 class="ct">후속 조치</h2>
    <ol style="margin:0;padding-left:18px;color:var(--ink-2)"><li>로거 원본 데이터(CSV)와 이탈 구간 그래프를 이탈 보고서에 첨부</li><li>${v[0]==='crit'?'해당 로트 격리 → 폐기 승인 → 보험 클레임 접수 (운송 중 발생 시)':v[0]==='warn'?'로트 격리 후 QA 책임자 판정 대기':'LIMS에 누적 노출 시간 갱신'}</li><li>운송사에 원인 조사(CAPA) 요청</li></ol>`;
  }
  $$('#dp,#dlo,#dhi,#dd,#dprev').forEach(e=>e.oninput=calc);calc();
});

/* 7. carriers */
def('carriers','물류 · 콜드체인','운송 파트너 리스크','노선·운송사별 온도 이탈 발생 빈도(선적 100건당)를 비교해 가장 안전한 파트너를 고릅니다.',root=>{
  const car=['NorthStar Air','Kestrel Cargo','Aerolink','Coldway Ocean','Tidal Reefer','Harbor Line'];
  const L=[['ICN→LAX','항공',[2.4,4.1,3.2,null,null,null]],['ICN→SGN','항공',[3.5,1.9,4.6,null,null,null]],['ICN→CGK','항공',[4.2,2.6,3.8,null,null,null]],['ICN→GRU','항공',[6.4,7.8,5.1,null,null,null]],['PUS→HAM','해상',[null,null,null,1.6,1.1,2.4]],['PUS→JED','해상',[null,null,null,3.9,5.6,2.8]],['PUS→JEA','해상',[null,null,null,2.7,3.6,2.2]]];
  const cells=L.flatMap(l=>l[2].map((v,i)=>({l:l[0],c:car[i],v})).filter(x=>x.v!=null)),worst=cells.reduce((a,b)=>b.v>a.v?b:a),best=cells.reduce((a,b)=>b.v<a.v?b:a),alt=cells.filter(x=>x.l===worst.l&&x.c!==worst.c).sort((a,b)=>a.v-b.v)[0],hard=L.find(l=>Math.min(...l[2].filter(v=>v!=null))>=5),wsh=SHIPMENTS.find(x=>x.carrier===worst.c&&worst.l.endsWith(x.to)&&x.stage<6);

  <section class="card"><div class="card-h"><h2 class="ct">온도 이탈 히트맵 (선적 100건당, 최근 12개월)</h2><div class="legend"><span><i style="background:var(--ok-soft)"></i>3 미만</span><span><i style="background:var(--warn-soft)"></i>3–5</span><span><i style="background:var(--crit-soft)"></i>5 이상</span></div></div>
  <div class="tbl"><table class="data heat"><thead><tr><th>노선</th>${car.map(c=>`<th style="text-align:center">${c}</th>`).join('')}<th>추천</th></tr></thead><tbody>
  ${L.map(l=>{const vals=l[2].filter(v=>v!=null),mn=Math.min(...vals),best=car[l[2].indexOf(mn)];return `<tr><td><b>${l[0]}</b> <span class="note">${l[1]}</span></td>${l[2].map(v=>v==null?`<td class="h" style="color:var(--muted)">—</td>`:`<td class="h" style="background:var(--${v<3?'ok':v<5?'warn':'crit'}-soft);color:var(--${v<3?'ok':v<5?'warn':'crit'});${v===mn?'font-weight:700;box-shadow:inset 0 0 0 2px var(--ok)':''}">${v.toFixed(1)}</td>`).join('')}<td>${best}</td></tr>`}).join('')}
  </tbody></table></div></section>
  <div class="row"><section class="card c-6"><div class="card-h"><h2 class="ct">운송사 종합 이탈률</h2><span class="sub">운항 노선 평균</span></div>
  ${hbars(car.map((c,i)=>{const v=L.map(l=>l[2][i]).filter(x=>x!=null);const a=v.reduce((x,y)=>x+y,0)/v.length;return{label:c,value:a,text:a.toFixed(1)+'건',c:a<3?'--ok':a<5?'--warn':'--crit'}}).sort((a,b)=>a.value-b.value))}</section>
  <section class="card c-6 stack"><h2 class="ct">권고 사항</h2>
  <div class="callout crit"><b>${worst.l} · ${worst.c}</b>이탈 ${worst.v.toFixed(1)}건으로 가장 높습니다.${wsh?` 진행 중인 ${wsh.id}도 이 운송사입니다.`:''} ${alt?`다음 선적부터 ${alt.c}(${alt.v.toFixed(1)}건)으로 전환을 검토하세요.`:''}</div>
  ${hard?`<div class="callout warn"><b>${hard[0]} 전 운송사 5건 이상</b>직항이 없어 환적 공항(프랑크푸르트·두바이 등) 계류 중 이탈이 집중됩니다. 120시간 인증 수동형 냉장 박스나 능동형 컨테이너(RKN 등)를 권장합니다.</div>`:''}
  <div class="callout ok"><b>${best.l} · ${best.c}</b>${best.v.toFixed(1)}건으로 가장 안정적입니다. 해상 리퍼 컨테이너는 온도 제어가 연속적이라 항공보다 이탈이 적은 편이지만, 항만 반입·하역 대기 구간은 따로 기록하세요.</div></section></div>`;
});
